<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProTrack Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#111827;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #00000010}
.stat{font-size:30px;font-weight:700;margin-top:8px}label{font-size:13px;font-weight:600}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:9px}
button{border:0;border-radius:9px;padding:11px 16px;background:#111827;color:#fff;cursor:pointer;margin-right:6px}
button.secondary{background:#e5e7eb;color:#111827}.hidden{display:none}.error{color:#b91c1c}.success{color:#047857}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}nav button{background:#374151}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}
</style>
</head>
<body>
<header>
  <div><strong>PROTRACK</strong><div style="font-size:12px;opacity:.75">Management</div></div>
  <div><span id="userName"></span> <button class="secondary" onclick="signOut()">Sign out</button></div>
</header>

<main>
<section id="loginCard" class="card">
  <h2>Management Sign in</h2>
  <label>Email</label><input id="email" type="email">
  <label>Password</label><input id="password" type="password">
  <button onclick="signIn()">Sign in</button>
  <p id="loginMessage"></p>
</section>

<section id="app" class="hidden">
<nav>
  <button onclick="showSection('dashboard')">Dashboard</button>
  <button onclick="showSection('dispatch')">Dispatch</button>
  <button onclick="showSection('drivers')">Drivers</button>
  <button onclick="showSection('activities')">Activities</button>
  <button onclick="showSection('guests')">Guests</button>
</nav>

<div id="dashboard">
  <div class="grid">
    <div class="card"><div>Today's Trips</div><div class="stat" id="tripCount">0</div></div>
    <div class="card"><div>Completed</div><div class="stat" id="completedCount">0</div></div>
    <div class="card"><div>Trip Value</div><div class="stat" id="tripValue">$0</div></div>
    <div class="card"><div>Outstanding</div><div class="stat" id="outstanding">$0</div></div>
  </div>
  <div class="card"><h2>Recent Trips</h2><div id="recentTrips">Loading...</div></div>
</div>

<div id="dispatch" class="hidden">
  <div class="card">
    <h2>Create & Dispatch Trip</h2>
    <label>Client name</label><input id="clientName">
    <label>Date & time</label><input id="tripDate" type="datetime-local">
    <label>Pickup</label><input id="pickup">
    <label>Destination</label><input id="destination">
    <label>Passengers</label><input id="passengers" type="number" min="1" value="1">
    <label>Price</label><input id="price" type="number" step="0.01">
    <label>Driver</label><select id="driverSelect"><option value="">Select driver</option></select>
    <label>Payment</label>
    <select id="paymentStatus">
      <option value="unpaid">Unpaid</option>
      <option value="paid">Paid</option>
      <option value="collect_on_return">Collect on return</option>
    </select>
    <label>Special instructions</label><input id="instructions">
    <button onclick="createTrip()">Create & assign</button>
    <p id="dispatchMessage"></p>
  </div>
</div>

<div id="drivers" class="hidden">
  <div class="card"><h2>Drivers</h2><div id="driversTable">Loading...</div></div>
</div>

<div id="activities" class="hidden">
  <div class="card">
    <h2>Activities</h2>
    <p>These are the activities currently visible to guests.</p>
    <div id="activitiesTable">Loading...</div>
  </div>
</div>

<div id="guests" class="hidden">
  <div class="card"><h2>Guest Bookings</h2><div id="guestBookings">Loading...</div></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(PROTRACK_CONFIG.supabaseUrl, PROTRACK_CONFIG.supabaseKey);
let currentProfile = null;

const $ = id => document.getElementById(id);
function showSection(name){
  ['dashboard','dispatch','drivers','activities','guests'].forEach(x => $(x).classList.toggle('hidden',x!==name));
  if(name==='dashboard') loadDashboard();
  if(name==='drivers') loadDrivers();
  if(name==='activities') loadActivities();
  if(name==='guests') loadGuestBookings();
}
async function signIn(){
  const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});
  if(error){$('loginMessage').textContent=error.message;return}
  await init();
}
async function signOut(){await db.auth.signOut();location.reload()}

async function init(){
  const {data:{user}}=await db.auth.getUser();
  if(!user)return;
  const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();
  if(error){$('loginMessage').textContent=error.message;return}
  if(!data || !['dispatcher','manager','admin'].includes(data.role)){
    $('loginMessage').textContent='This account does not have management access.';
    await db.auth.signOut();return;
  }
  currentProfile=data;
  $('userName').textContent=data.full_name;
  $('loginCard').classList.add('hidden');
  $('app').classList.remove('hidden');
  await loadDashboard(); await loadDrivers(); await loadActivities(); await loadGuestBookings();
  db.channel('protrack-management')
    .on('postgres_changes',{event:'*',schema:'public',table:'trips'},loadDashboard)
    .on('postgres_changes',{event:'*',schema:'public',table:'guest_bookings'},loadGuestBookings)
    .subscribe();
}

async function loadDashboard(){
  const start=new Date(); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(end.getDate()+1);
  const {data,error}=await db.from('trips').select('id,price,status,payment_status,scheduled_at,pickup_location,destination_location,passenger_count,booking_reference').gte('scheduled_at',start.toISOString()).lt('scheduled_at',end.toISOString()).order('scheduled_at');
  if(error){$('recentTrips').textContent=error.message;return}
  const trips=data||[];
  $('tripCount').textContent=trips.length;
  $('completedCount').textContent=trips.filter(t=>t.status==='completed').length;
  $('tripValue').textContent='$'+trips.reduce((s,t)=>s+Number(t.price||0),0).toFixed(2);
  $('outstanding').textContent='$'+trips.filter(t=>['unpaid','partial','collect_on_return'].includes(t.payment_status)).reduce((s,t)=>s+Number(t.price||0),0).toFixed(2);
  $('recentTrips').innerHTML=trips.length?'<table><tr><th>Time</th><th>Trip</th><th>Route</th><th>Pax</th><th>Price</th><th>Status</th></tr>'+
    trips.map(t=>`<tr><td>${new Date(t.scheduled_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td><td>${t.booking_reference}</td><td>${esc(t.pickup_location)} → ${esc(t.destination_location)}</td><td>${t.passenger_count}</td><td>$${Number(t.price).toFixed(2)}</td><td><span class="badge">${t.status}</span></td></tr>`).join('')+'</table>':'No trips today.';
}

async function loadDrivers(){
  const {data,error}=await db.from('profiles').select('id,full_name,phone,active').eq('role','driver').order('full_name');
  if(error)return;
  $('driverSelect').innerHTML='<option value="">Select driver</option>'+(data||[]).filter(d=>d.active).map(d=>`<option value="${d.id}">${esc(d.full_name)}</option>`).join('');
  $('driversTable').innerHTML='<table><tr><th>Name</th><th>Phone</th><th>Status</th></tr>'+
    (data||[]).map(d=>`<tr><td>${esc(d.full_name)}</td><td>${esc(d.phone||'')}</td><td>${d.active?'Active':'Inactive'}</td></tr>`).join('')+'</table>';
}

async function createTrip(){
  const driver=$('driverSelect').value;
  if(!driver)return $('dispatchMessage').textContent='Select a driver.';
  const name=$('clientName').value.trim();
  if(!name)return $('dispatchMessage').textContent='Enter a client name.';
  const {data:client,error:ce}=await db.from('clients').insert({name}).select().single();
  if(ce)return $('dispatchMessage').textContent=ce.message;
  const payment=$('paymentStatus').value;
  const {data:trip,error:te}=await db.from('trips').insert({
    client_id:client.id,
    scheduled_at:new Date($('tripDate').value).toISOString(),
    pickup_location:$('pickup').value.trim(),
    destination_location:$('destination').value.trim(),
    passenger_count:Number($('passengers').value),
    price:Number($('price').value||0),
    payment_status:payment,
    payment_due_on_return:payment==='collect_on_return',
    special_instructions:$('instructions').value.trim(),
    created_by:currentProfile.id,
    status:'assigned'
  }).select().single();
  if(te)return $('dispatchMessage').textContent=te.message;
  const {error:ae}=await db.from('trip_assignments').insert({trip_id:trip.id,driver_id:driver});
  if(ae)return $('dispatchMessage').textContent=ae.message;
  $('dispatchMessage').className='success';$('dispatchMessage').textContent='Trip created and assigned.';
  ['clientName','pickup','destination','price','instructions'].forEach(x=>$(x).value='');
  $('passengers').value=1;$('driverSelect').value='';
  await loadDashboard();
}

async function loadActivities(){
  const {data,error}=await db.from('activities').select('id,name,location,price,price_type,active,activity_categories(name)').order('name');
  if(error)return $('activitiesTable').textContent=error.message;
  $('activitiesTable').innerHTML=data?.length?'<table><tr><th>Name</th><th>Category</th><th>Location</th><th>Price</th><th>Status</th></tr>'+
    data.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.activity_categories?.name||'')}</td><td>${esc(a.location||'')}</td><td>$${Number(a.price||0).toFixed(2)} / ${esc(a.price_type)}</td><td>${a.active?'Active':'Inactive'}</td></tr>`).join('')+'</table>':'No activities created yet.';
}

async function loadGuestBookings(){
  const {data,error}=await db.from('guest_bookings').select('id,booking_reference,status,total_amount,payment_status,booking_date,properties(name)').order('booking_date',{ascending:false}).limit(50);
  if(error)return $('guestBookings').textContent=error.message;
  $('guestBookings').innerHTML=data?.length?'<table><tr><th>Reference</th><th>Property</th><th>Date</th><th>Total</th><th>Status</th><th>Payment</th></tr>'+
    data.map(b=>`<tr><td>${esc(b.booking_reference)}</td><td>${esc(b.properties?.name||'')}</td><td>${new Date(b.booking_date).toLocaleString()}</td><td>$${Number(b.total_amount||0).toFixed(2)}</td><td>${b.status}</td><td>${b.payment_status}</td></tr>`).join('')+'</table>':'No guest bookings yet.';
}

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
init();
</script>
</body>
</html>
