<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#718096;--line:#e4e9f0;--brand:#1456d9;--brand2:#0b3eaa;--danger:#c62828;--ok:#138a52;--warn:#a76500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 16px 50px #17345a12}
.logo{font-size:26px;font-weight:800;letter-spacing:-.7px}.sub{color:var(--muted);margin-top:5px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d8dee8;border-radius:10px;background:#fff}.field textarea{min-height:85px;resize:vertical}
.primary{background:var(--brand);color:#fff;padding:11px 15px;border-radius:10px;font-weight:700}.primary:hover{background:var(--brand2)}.secondary{background:#edf2f8;color:#26364d;padding:9px 13px;border-radius:9px;font-weight:700}.danger{background:#fff0f0;color:var(--danger);padding:8px 11px;border-radius:8px;font-weight:700}.success{background:#eaf8f1;color:var(--ok);padding:8px 11px;border-radius:8px;font-weight:700}
.app{display:flex;min-height:100vh}.side{width:245px;background:#101a2c;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{padding:4px 10px 22px;font-size:23px;font-weight:800}.brand small{display:block;color:#8fa1bf;font-size:11px;margin-top:3px}.nav-group{margin:17px 0 7px 10px;color:#7083a3;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1px}.nav button{width:100%;text-align:left;background:transparent;color:#d9e1ef;padding:10px 12px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#1b2a45;color:#fff}.main{margin-left:245px;flex:1;padding:25px;max-width:1700px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:25px}.top-right{display:flex;gap:9px;align-items:center}.user-pill{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:#52627a}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.metric{font-size:25px;font-weight:800;margin-top:6px}.muted{color:var(--muted)}.section{background:#fff;border:1px solid var(--line);border-radius:13px;margin-top:16px;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}.section-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{padding:9px 10px;border:1px solid #d8dee8;border-radius:9px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf0f4;vertical-align:middle}.table th{font-size:11px;color:#748198;text-transform:uppercase;letter-spacing:.4px;background:#fbfcfe}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f8;color:#45556d;font-size:11px;font-weight:800}.badge.ok{background:#e7f7ef;color:#117a49}.badge.warn{background:#fff3df;color:#9b6100}.badge.bad{background:#ffe9e9;color:#b72c2c}
.empty{padding:30px;text-align:center;color:var(--muted)}.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px}.check-item{font-size:13px;padding:7px}.activity-image-row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;margin-bottom:8px}.activity-image-row input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px;margin:2px}.detail-gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px}.detail-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modal{position:fixed;inset:0;background:#09111c80;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{margin:0;font-size:19px}.x{background:#edf2f8;border-radius:8px;padding:6px 10px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.notice{padding:11px 13px;border-radius:9px;margin:10px 0;background:#eef5ff;color:#27528c}.error{background:#fff0f0;color:#b22b2b}.oktext{color:var(--ok);font-weight:700}
.kpi-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{padding:12px;background:#f7f9fc;border-radius:10px}.mini b{display:block;font-size:18px;margin-top:3px}

/* Rental fleet calendar */
.rental-cal-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px;border-radius:17px;background:linear-gradient(120deg,#10213b,#17446a);color:#fff;margin:14px 0 16px}.rental-cal-hero h2{margin:0 0 7px;font-size:21px}.rental-cal-hero p{margin:0;color:#d0dced;line-height:1.5;max-width:720px}.rental-cal-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rental-cal-toolbar select,.rental-cal-toolbar input{padding:9px 10px;border:1px solid #d8dee8;border-radius:9px;background:#fff}.rental-cal-month{font-size:21px;font-weight:850;min-width:190px;text-align:center}.rental-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}.rental-cal-dow{padding:10px 6px;text-align:center;background:#f7f9fc;color:#718096;font-size:11px;font-weight:850;text-transform:uppercase;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.rental-cal-day{min-height:128px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;background:#fff}.rental-cal-day.outside{background:#f8fafc;color:#a2adbd}.rental-cal-day.today{box-shadow:inset 0 0 0 2px #7aa5ff}.rental-cal-day.selected{background:#f0f6ff}.rental-cal-dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800;font-size:12px}.rental-cal-event{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:5px 6px;margin:3px 0;background:#e8f0ff;color:#234d93;font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rental-cal-event.status-requested{background:#fff1d8;color:#875400}.rental-cal-event.status-approved{background:#e7f7ef;color:#147348}.rental-cal-event.status-picked_up{background:#e9e5ff;color:#5740a0}.rental-cal-event.status-returned,.rental-cal-event.status-completed{background:#e9eef4;color:#526174}.rental-cal-event.status-cancelled,.rental-cal-event.status-rejected{background:#ffe8e8;color:#a52b2b;text-decoration:line-through}.rental-cal-more{font-size:10px;color:#65758b;padding:3px 5px}.rental-cal-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;color:#64748b;font-size:11px}.rental-cal-legend span{display:flex;align-items:center;gap:5px}.rental-cal-dot{width:9px;height:9px;border-radius:3px;display:inline-block}.rental-agenda-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #edf0f4}.rental-agenda-row:last-child{border-bottom:0}.rental-agenda-title{font-weight:800}.rental-agenda-meta{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}.rental-cal-smallbtn{padding:7px 10px;font-size:12px}
@media(max-width:900px){.rental-cal-day{min-height:105px;padding:4px}.rental-cal-event{font-size:9px;padding:4px}.rental-cal-month{min-width:140px;font-size:17px}}
@media(max-width:600px){.rental-cal-day{min-height:78px;padding:3px}.rental-cal-event{white-space:normal;max-height:36px;overflow:hidden;font-size:8px}.rental-cal-dayhead{font-size:10px}.rental-cal-hero{flex-direction:column}.rental-cal-toolbar{width:100%}.rental-cal-toolbar select{flex:1;min-width:120px}}

@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.side{width:210px}.main{margin-left:210px}}
@media(max-width:700px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;padding:15px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.cards,.grid2,.grid3,.check-grid,.detail-gallery{grid-template-columns:1fr}.activity-image-row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.table{min-width:650px}}

/* Transport pricing workspace refresh */
.transport-workspace-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px;background:linear-gradient(120deg,#10213b,#173a67);color:#fff;border-radius:18px;margin:14px 0 18px;box-shadow:0 12px 30px #10213b16}
.transport-workspace-intro h2{margin:0 0 6px;font-size:21px;letter-spacing:-.5px}.transport-workspace-intro p{margin:0;color:#c6d5e9;line-height:1.6;max-width:720px}.transport-workspace-intro .workspace-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffffff2b;background:#ffffff12;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.transport-stepbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px}.transport-stepcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-width:0}.transport-stepcard .stepnum{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:11px;background:#e9f1ff;color:#1456d9;font-weight:900}.transport-stepcard b{display:block;font-size:13px}.transport-stepcard small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}
.transport-section{border-radius:17px;box-shadow:0 4px 18px #17203306;margin-top:14px}.transport-section .section-head{padding:18px 20px;background:linear-gradient(180deg,#fff,#fcfdff)}.transport-section .section-head h2{font-size:16px;letter-spacing:-.2px}.transport-section .section-body{padding:18px 20px}.transport-section .section-description{font-size:12px;color:var(--muted);line-height:1.55;margin-top:5px;max-width:760px}.transport-inline-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;max-width:650px}.transport-inline-add input,.transport-search{width:100%;min-width:0;padding:11px 13px;border:1px solid #d8e0eb;border-radius:11px;background:#fbfcff;outline:none}.transport-inline-add input:focus,.transport-search:focus{border-color:#80a7f7;box-shadow:0 0 0 4px #1456d911;background:#fff}.transport-list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0}.transport-search-wrap{position:relative;flex:1;min-width:220px;max-width:420px}.transport-search-wrap:before{content:'⌕';position:absolute;left:12px;top:7px;color:#7c8ba2;font-size:20px}.transport-search{padding-left:37px}.transport-count{font-size:12px;color:var(--muted);font-weight:700}.transport-zone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.transport-zone-card,.transport-fare-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;min-width:0;transition:box-shadow .18s,border-color .18s}.transport-zone-card:hover,.transport-fare-card:hover{border-color:#c5d4ed;box-shadow:0 8px 22px #18365c0b}.transport-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.transport-card-title{font-size:14px;font-weight:850;overflow-wrap:anywhere}.transport-card-sub{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}.transport-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid #edf0f5}.transport-card-actions button{font-size:11px;padding:7px 9px}.transport-zone-count{display:inline-flex;align-items:center;gap:6px;background:#f1f5fc;color:#385477;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;margin-top:13px}.transport-fare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.transport-fare-card{padding:17px}.transport-fare-route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:850;font-size:13px}.transport-fare-zone{background:#edf3ff;color:#204d9c;border-radius:9px;padding:7px 9px}.transport-fare-arrow{color:#8090a8;font-size:17px}.transport-fare-price-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.transport-fare-price{background:#f7f9fc;border:1px solid #edf1f6;border-radius:11px;padding:11px}.transport-fare-price small{display:block;font-size:10px;color:var(--muted);line-height:1.35}.transport-fare-price strong{display:block;font-size:21px;letter-spacing:-.5px;margin-top:4px}.transport-fare-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;font-size:11px;color:var(--muted)}.transport-section .field label{font-size:12px;color:#3b4b62}.transport-form-panel{background:#f7f9fd;border:1px solid #e5ebf4;border-radius:14px;padding:16px;margin-bottom:15px}.transport-form-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.transport-form-panel-head b{font-size:13px}.transport-form-panel-head span{font-size:11px;color:var(--muted)}
@media(max-width:1100px){.transport-zone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.transport-workspace-intro{padding:17px;display:block}.transport-workspace-intro .workspace-chip{margin-top:14px}.transport-stepbar{grid-template-columns:1fr}.transport-zone-grid,.transport-fare-grid{grid-template-columns:1fr}.transport-section .section-body{padding:14px}.transport-section .section-head{padding:15px}.transport-inline-add{grid-template-columns:1fr}.transport-fare-price strong{font-size:19px}}


/* Operations upgrade */
.ops-hero{background:linear-gradient(120deg,#10213b,#1b5273);color:#fff;padding:22px;border-radius:18px;margin:8px 0 16px}.ops-hero h2{margin:0 0 7px;font-size:22px}.ops-hero p{margin:0;color:#d4e1ef;line-height:1.55}.ops-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.ops-actions button{border-radius:9px;padding:9px 12px;font-weight:750}.ops-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.ops-alert{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid #edf0f4}.ops-alert:last-child{border-bottom:0}.ops-alert-title{font-weight:800}.ops-alert-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.ops-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.ops-form-grid .field{min-width:0}.inspection-photo-list{display:grid;gap:7px;margin-top:10px}.inspection-photo-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 11px;background:#f5f8fc;border:1px solid #e2e9f3;border-radius:9px}.inspection-photo-item span:first-child{flex:1;overflow-wrap:anywhere}.inspection-photo-item button{padding:6px 9px;font-size:12px}.ops-kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.ops-kpi b{display:block;font-size:24px;margin-top:6px}.status-chip{display:inline-block;border-radius:999px;background:#eaf0f7;padding:4px 8px;font-size:11px;font-weight:800}.status-chip.urgent{background:#ffe7e7;color:#a52727}.status-chip.warning{background:#fff1d6;color:#865700}
@media(max-width:900px){.ops-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.ops-grid,.ops-form-grid{grid-template-columns:1fr}.ops-hero{padding:17px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">ProTrack</div><div class="sub">Management Command Center</div>
    <div id="loginMsg"></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="primary" style="width:100%" onclick="login()">Sign in</button>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="side">
  <div class="brand">ProTrack<small>OPERATIONS PLATFORM</small></div>
  <div class="nav">
    <div class="nav-group">Operations</div>
    <button data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button>

    <button data-page="drivers" onclick="showPage('drivers')">Drivers</button>
    <button data-page="guests" onclick="showPage('guests')">Guests</button>
    <button data-page="properties" onclick="showPage('properties')">Properties</button>
    <div class="nav-group">Fleet</div>
    <button data-page="vehicles" onclick="showPage('vehicles')">Vehicles</button>
    <button data-page="rentalProducts" onclick="showPage('rentalProducts')">Car & ATV Rentals</button>
    <button data-page="rentalBookings" onclick="showPage('rentalBookings')">Rental Bookings</button>
    <button data-page="rentalCalendar" onclick="showPage('rentalCalendar')">Rental Calendar</button>
    <button data-page="fleetUnits" onclick="showPage('fleetUnits')">Individual Fleet Units</button>
    <button data-page="rentalMaintenance" onclick="showPage('rentalMaintenance')">Maintenance & Downtime</button>
    <button data-page="rentalInspections" onclick="showPage('rentalInspections')">Pickup / Return Inspections</button>
    <div class="nav-group">Transportation</div>
    <button data-page="transport" onclick="showPage('transport')">Transport Requests & Setup</button>

    <button data-page="activities" onclick="showPage('activities')">Activities</button>

    <button data-page="notifications" onclick="showPage('notifications')">Notifications & Audit</button>

    <button onclick="logout()">Sign out</button>
  </div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="pageSub">Today’s operations</div></div><div class="top-right"><button class="secondary" onclick="showPage('notifications')">🔔 Notifications</button><span class="user-pill" id="userName"></span></div></div>
  <div id="content"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const cfg=window.PROTRACK_CONFIG||{};
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
let me=null, profile=null, currentPage='dashboard';
const MANAGEMENT_VIEW_KEY='protrack_management_view_v1';
function readManagementView(){try{return JSON.parse(localStorage.getItem(MANAGEMENT_VIEW_KEY)||'{}')}catch(_){return {}}}
function writeManagementView(patch={}){try{const old=readManagementView();localStorage.setItem(MANAGEMENT_VIEW_KEY,JSON.stringify({...old,...patch,updatedAt:Date.now()}))}catch(_){}}
function rememberManagementScroll(){const state=readManagementView();const scrollByPage={...(state.scrollByPage||{}),[currentPage]:window.scrollY||0};writeManagementView({page:currentPage,scrollY:window.scrollY||0,scrollByPage})}
let managementScrollTimer=null;window.addEventListener('scroll',()=>{if(managementScrollTimer)clearTimeout(managementScrollTimer);managementScrollTimer=setTimeout(rememberManagementScroll,120)},{passive:true});window.addEventListener('beforeunload',rememberManagementScroll);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>'$'+Number(v||0).toFixed(2);
const fmtDate=v=>v?new Date(v).toLocaleString([], {dateStyle:'short',timeStyle:'short'}):'—';
const dateOnly=v=>v?new Date(v).toLocaleDateString(): '—';
const badge=s=>{let c=['completed','paid','active','accepted'].includes(s)?'ok':['requested','scheduled','assigned','partial','collect_on_return'].includes(s)?'warn':['cancelled','unpaid','rejected'].includes(s)?'bad':'';return `<span class="badge ${c}">${esc(s||'—')}</span>`};

async function activities(){
 try{
  const [ar,lr,cr]=await Promise.all([
   sb.from('activities').select('*').order('name'),
   sb.from('activity_category_links').select('activity_id,category_id'),
   sb.from('activity_categories').select('id,name,active').eq('active',true).order('name')
  ]);
  const err=[ar,lr,cr].find(x=>x.error);
  if(err){document.getElementById('content').innerHTML=msg('Could not load activities: '+err.error.message,true);return}
  const acts=ar.data||[], links=lr.data||[], categoriesList=cr.data||[];
  const catNames=Object.fromEntries(categoriesList.map(c=>[c.id,c.name]));
  const cats={};
  links.forEach(x=>{if(!cats[x.activity_id])cats[x.activity_id]=[];if(catNames[x.category_id])cats[x.activity_id].push(catNames[x.category_id])});
  // Preserve the original single category assignment for older activities that were created before multi-category support.
  acts.forEach(a=>{if(!cats[a.id]?.length && a.category_id && catNames[a.category_id])cats[a.id]=[catNames[a.category_id]]});
  document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Activities</h2><button class="primary" onclick="activityForm()">+ Add Activity</button></div>${table(['Activity','Categories','Price','Guests','Transport','Active','Actions'],acts.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="muted">${esc(a.short_description||'')}</div></td><td>${(cats[a.id]||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'<span class="muted">—</span>'}</td><td>${money(a.price)} / ${esc(a.price_type)}</td><td>${a.minimum_guests}–${a.maximum_guests??'∞'}</td><td>${a.transportation_available?'Yes':'No'}</td><td>${badge(a.active?'active':'inactive')}</td><td><button class="secondary" onclick="activityFormById('${a.id}')">Edit</button></td></tr>`).join(''))}</div>`;
 }catch(e){document.getElementById('content').innerHTML=msg('Could not load activities: '+e.message,true)}
}

async function activityFormById(id){
  try{
    const [ar,lr,ir,cr,tr]=await Promise.all([
      sb.from('activities').select('*').eq('id',id).single(),
      sb.from('activity_category_links').select('category_id').eq('activity_id',id),
      sb.from('activity_images').select('*').eq('activity_id',id).order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('activity_categories').select('id,name,active').eq('active',true).order('name'),
      sb.from('activity_time_slots').select('*').eq('activity_id',id).order('sort_order',{ascending:true}).order('start_time',{ascending:true})
    ]);
    const err=[ar,lr,ir,cr,tr].find(x=>x.error);
    if(err){openModal('Could not edit activity',msg(err.error.message,true));return}
    const a=ar.data;
    a._categoryIds=(lr.data||[]).map(x=>x.category_id);
    a._images=ir.data||[];
    a._timeSlots=tr.data||[];
    activityForm(a,cr.data||[]);
  }catch(e){openModal('Could not edit activity',msg(e.message,true))}
}

function updateMainImagePosition(){
  const xEl=document.getElementById('a_image_position_x');
  const yEl=document.getElementById('a_image_position_y');
  if(!xEl||!yEl)return;
  const x=Math.max(0,Math.min(100,Number(xEl.value)||0));
  const y=Math.max(0,Math.min(100,Number(yEl.value)||0));
  const xl=document.getElementById('a_image_position_x_label');
  const yl=document.getElementById('a_image_position_y_label');
  if(xl)xl.textContent=x+'%';
  if(yl)yl.textContent=y+'%';
  document.querySelectorAll('#mainImageCardPreview,#mainImageDetailPreview').forEach(preview=>{
    preview.style.objectPosition=`${x}% ${y}%`;
  });
}
function updateMainImagePreview(){
  const url=document.getElementById('a_main_url')?.value.trim()||'';
  const cardPreview=document.getElementById('mainImageCardPreview');
  const detailPreview=document.getElementById('mainImageDetailPreview');
  const placeholder=document.getElementById('mainImageDetailPlaceholder');
  if(!cardPreview||!detailPreview)return;
  if(!url){
    cardPreview.removeAttribute('src');
    detailPreview.removeAttribute('src');
    cardPreview.style.display='none';
    detailPreview.style.display='none';
    if(placeholder)placeholder.style.display='grid';
    return;
  }
  if(cardPreview.getAttribute('src')!==url)cardPreview.src=url;
  if(detailPreview.getAttribute('src')!==url)detailPreview.src=url;
  cardPreview.style.display='block';
  detailPreview.style.display='block';
  if(placeholder)placeholder.style.display='none';
  updateMainImagePosition();
}
function resetMainImagePosition(){
  const x=document.getElementById('a_image_position_x');
  const y=document.getElementById('a_image_position_y');
  if(x)x.value='50';
  if(y)y.value='50';
  updateMainImagePosition();
}

function activityTimeSlotRowHTML(slot={},i=0){
  return `<div class="activity-time-slot-row" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:center">
    <div class="field" style="margin:0"><label>Start time ${i+1}</label><input class="activity-time-slot-value" type="time" value="${esc(String(slot.start_time||'').slice(0,5))}" style="width:100%"></div>
    <button type="button" class="secondary" onclick="this.parentElement.remove()">Remove</button>
  </div>`;
}
function addActivityTimeSlotRow(){
  const el=document.getElementById('activityTimeSlots');
  if(el)el.insertAdjacentHTML('beforeend',activityTimeSlotRowHTML({},el.querySelectorAll('.activity-time-slot-row').length));
}

async function saveActivityFull(id){
  const name=document.getElementById('a_name')?.value.trim();
  if(!name){alert('Please enter an activity name.');return}

  const depositInput=document.getElementById('a_deposit_percentage')?.value.trim();
  if(depositInput!=='' && (!Number.isFinite(Number(depositInput)) || Number(depositInput)<0 || Number(depositInput)>100)){alert('Deposit percentage must be between 0 and 100.');return}

  const categoryIds=[...document.querySelectorAll('.activity-category:checked')].map(x=>x.value);
  const timeSlotRows=[...document.querySelectorAll('.activity-time-slot-row')];
  const timeSlots=[];
  for(const row of timeSlotRows){
    const value=row.querySelector('.activity-time-slot-value')?.value||'';
    if(value)timeSlots.push({start_time:value,sort_order:timeSlots.length});
  }
  if(new Set(timeSlots.map(x=>x.start_time)).size!==timeSlots.length){alert('Please remove duplicate activity times.');return}

  const mainImageUrl=document.getElementById('a_main_url')?.value.trim()||null;

  const detailRows=[...document.querySelectorAll('.activity-image-row')];
  const imageRows=[];
  for(let i=0;i<detailRows.length;i++){
    const row=detailRows[i];
    const imageUrl=row.querySelector('.activity-image-url')?.value.trim()||null;
    if(imageUrl)imageRows.push({image_url:imageUrl,caption:row.querySelector('.activity-image-caption')?.value.trim()||null,sort_order:imageRows.length});
  }

  const data={
    name,
    image_url:mainImageUrl,
    image_position_x:Math.max(0,Math.min(100,Number(document.getElementById('a_image_position_x')?.value??50))),
    image_position_y:Math.max(0,Math.min(100,Number(document.getElementById('a_image_position_y')?.value??50))),
    category_id:categoryIds[0]||null,
    location:document.getElementById('a_location').value.trim()||null,
    duration_minutes:document.getElementById('a_duration').value?Number(document.getElementById('a_duration').value):null,
    activity_times:document.getElementById('a_activity_times').value.trim()||null,
    price:document.getElementById('a_price').value?Number(document.getElementById('a_price').value):null,
    price_type:document.getElementById('a_price_type').value,
    minimum_guests:Number(document.getElementById('a_min').value||1),
    maximum_guests:document.getElementById('a_max').value?Number(document.getElementById('a_max').value):null,
    pickup_available:document.getElementById('a_pickup').checked,
    transportation_available:document.getElementById('a_transport').checked,
    short_description:document.getElementById('a_short').value.trim()||null,
    description:document.getElementById('a_desc').value.trim()||null,
    terms_conditions:document.getElementById('a_terms').value.trim()||null,
    deposit_percentage:document.getElementById('a_deposit_percentage').value.trim()===''?null:Number(document.getElementById('a_deposit_percentage').value),
    active:document.getElementById('a_active').value==='true'
  };

  try{
    let activityId=id;
    let r;
    if(id){
      r=await sb.from('activities').update(data).eq('id',id).select('id').single();
    }else{
      r=await sb.from('activities').insert(data).select('id').single();
      activityId=r.data?.id;
    }
    if(r.error){openModal('Could not save activity',msg(r.error.message,true));return}

    const d1=await sb.from('activity_category_links').delete().eq('activity_id',activityId);
    if(d1.error){openModal('Could not save categories',msg(d1.error.message,true));return}
    if(categoryIds.length){
      const rows=categoryIds.map(category_id=>({activity_id:activityId,category_id}));
      const d2=await sb.from('activity_category_links').insert(rows);
      if(d2.error){openModal('Could not save categories',msg(d2.error.message,true));return}
    }

    const d3=await sb.from('activity_images').delete().eq('activity_id',activityId);
    if(d3.error){openModal('Could not save pictures',msg(d3.error.message,true));return}
    if(imageRows.length){
      const d4=await sb.from('activity_images').insert(imageRows.map(x=>({...x,activity_id:activityId})));
      if(d4.error){openModal('Could not save pictures',msg(d4.error.message,true));return}
    }

    const tsDelete=await sb.from('activity_time_slots').delete().eq('activity_id',activityId);
    if(tsDelete.error){openModal('Could not save activity times',msg(tsDelete.error.message,true));return}
    if(timeSlots.length){
      const tsInsert=await sb.from('activity_time_slots').insert(timeSlots.map(x=>({...x,activity_id:activityId})));
      if(tsInsert.error){openModal('Could not save activity times',msg(tsInsert.error.message,true));return}
    }

    closeModal();
    showPage('activities');
  }catch(e){openModal('Could not save activity',msg(e.message,true))}
}

async function loadReports(){
  const from=document.getElementById('rep_from')?.value, to=document.getElementById('rep_to')?.value;
  if(!from||!to)return; if(to<from){alert('The end date must be on or after the start date.');return}

  const completed=trips.filter(x=>x.status==='completed').length, cancelled=trips.filter(x=>x.status==='cancelled').length;

  const payRows=[['Cash',cashCollected],['Card',cardCollected],['Other',otherCollected]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${collected?((x[1]/collected)*100).toFixed(1)+'%':'0%'}</td></tr>`).join('');
  const expenseByCat={}; expensesData.forEach(x=>{expenseByCat[x.category]=(expenseByCat[x.category]||0)+Number(x.amount||0)});
  const expenseRows=Object.entries(expenseByCat).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0])}</td><td>${money(x[1])}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No expenses.</td></tr>';
  body.innerHTML=`<div class="cards"><div class="card"><div class="muted">Trip Value</div><div class="metric">${money(tripValue)}</div></div><div class="card"><div class="muted">Payments Collected</div><div class="metric">${money(collected)}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">${money(expensesTotal)}</div></div><div class="card"><div class="muted">Net Collected</div><div class="metric">${money(net)}</div></div><div class="card"><div class="muted">Trips</div><div class="metric">${trips.length}</div></div><div class="card"><div class="muted">Avg Trip Value</div><div class="metric">${money(avg)}</div></div></div>
  <div class="cards" style="margin-top:13px"><div class="card"><div class="muted">Completed</div><div class="metric">${completed}</div></div><div class="card"><div class="muted">Cancelled</div><div class="metric">${cancelled}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric">${money(outstandingTotal)}</div></div><div class="card"><div class="muted">Cash Variance</div><div class="metric">${money(variance)}</div></div><div class="card"><div class="muted">Open Cash Sessions</div><div class="metric">${openSessions}</div></div></div>
  <div class="grid2" style="margin-top:13px"><div class="section"><div class="section-head"><h2>Payment Methods</h2></div>${table(['Method','Collected','Share'],payRows)}</div><div class="section"><div class="section-head"><h2>Trip Status</h2></div>${table(['Status','Trips','Share'],statusRows)}</div></div>

 window.editTransportZone=id=>{const z=zones.find(x=>x.id===id);if(!z)return;openModal('Edit zone',`<div class="field"><label>Zone name</label><input id="trEditZoneName" maxlength="100" value="${esc(z.name)}" required></div><div class="form-actions"><button class="primary" onclick="saveTransportZone('${id}')">Save changes</button></div>`)};

 window.toggleTransportZone=async(id,active)=>{const z=zones.find(x=>x.id===id);if(!z)return;if(!confirm(`${active?'Deactivate':'Activate'} zone "${z.name}"? Deactivating hides it from new selections.`))return;const r=await sb.from('transport_zones').update({active:!active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Zone status updated.');await load()}};

 window.editTransportDestination=id=>{const d=dests.find(x=>x.id===id);if(!d)return;openModal('Rename destination',`<div class="field"><label>Destination name</label><input id="trEditDestinationName" maxlength="120" value="${esc(d.name)}" required></div><div class="form-actions"><button class="primary" onclick="saveTransportDestination('${id}')">Save changes</button></div>`)};

 window.resetTransportZoneFareForm=()=>{if(!$('trZoneFareForm'))return;$('trZoneFareForm').reset();$('trZoneFareId').value='';$('trZoneFareFormTitle').textContent='Add a new zone fare';$('trZoneFareSaveButton').textContent='Save zone fare';$('trZoneFareHelp').textContent='One fare covers both directions. You can also create a within-zone fare, such as Cupecoy ↔ Cupecoy.';$('trZoneDuration').value=30;$('trZoneFixedFare').value=0;$('trZonePaxFare').value=0;$('trZoneWaiting').value=0;$('trZoneStop').value=0;$('trZoneSpecial').value=0};

async function rentalInspections(){const [checks,bookings,units]=await Promise.all([sb.from('rental_handover_checks').select('*').order('checked_at',{ascending:false}).limit(100),sb.from('rental_bookings').select('id,reference,product_name,guest_name,status,rental_unit_id').order('created_at',{ascending:false}).limit(300),sb.from('rental_units').select('id,unit_code')]);if(checks.error||bookings.error||units.error){document.getElementById('content').innerHTML=msg('Inspection tables are unavailable. Apply the operations upgrade migration first.',true);return}const bs=bookings.data||[],us=units.data||[];document.getElementById('content').innerHTML=`<div class="ops-hero"><h2>Pickup & return inspections</h2><p>Record condition, odometer, fuel level, damage notes and take photos directly from your phone or tablet. Photos upload securely as you capture them.</p><div class="ops-actions"><button class="secondary" onclick="rentalInspectionForm()">+ Record inspection</button></div></div><div class="section"><div class="section-head"><h2>Recent inspections</h2></div>${table(['When','Booking / Guest','Vehicle','Type','Condition','Fuel','Odometer','Notes'],(checks.data||[]).map(c=>{const b=bs.find(x=>x.id===c.booking_id)||{};const u=us.find(x=>x.id===c.unit_id)||{};return `<tr><td>${fmtDate(c.checked_at)}</td><td><b>${esc(b.reference||c.booking_id)}</b><div class="muted">${esc(b.guest_name||'')}</div></td><td>${esc(u.unit_code||'Unassigned')}</td><td>${badge(c.check_type)}</td><td>${badge(c.condition_rating)}</td><td>${c.fuel_percent==null?'—':c.fuel_percent+'%'}</td><td>${c.odometer_km==null?'—':c.odometer_km+' km'}</td><td>${esc(c.damage_notes||'—')}</td></tr>`}).join(''))}</div>`}
let hiUploadedPhotos=[];let hiUploadBusy=false;
async function rentalInspectionForm(bookingId=''){const [bs,us]=await Promise.all([q('rental_bookings','id,reference,product_name,guest_name,rental_unit_id').then(x=>x.slice(0,250)),q('rental_units','id,unit_code')]);hiUploadedPhotos=[];hiUploadBusy=false;openModal('Record pickup / return inspection',`<div class="field"><label>Booking *</label><select id="hi_booking">${bs.map(b=>`<option value="${b.id}" ${bookingId===b.id?'selected':''}>${esc(b.reference)} · ${esc(b.product_name)} · ${esc(b.guest_name)}</option>`).join('')}</select></div><div class="field"><label>Vehicle (if assigned)</label><select id="hi_unit"><option value="">Not assigned</option>${us.map(u=>`<option value="${u.id}">${esc(u.unit_code)}</option>`).join('')}</select></div><div class="ops-form-grid"><div class="field"><label>Inspection type</label><select id="hi_type"><option value="pickup">Pickup / departure</option><option value="return">Return</option></select></div><div class="field"><label>Condition</label><select id="hi_condition">${['excellent','good','fair','needs_repair'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Odometer / km</label><input id="hi_odo" type="number" min="0" step="0.1"></div><div class="field"><label>Fuel level (%)</label><input id="hi_fuel" type="number" min="0" max="100" step="1"></div></div><div class="field"><label>Damage / condition notes</label><textarea id="hi_damage"></textarea></div><div class="field"><label>Inspection photos</label><div class="notice">Tap the camera button on a phone or tablet to open the camera. Each selected photo uploads to secure storage immediately. Keep the page open until uploads finish.</div><input id="hi_camera_input" type="file" accept="image/*" capture="environment" multiple onchange="hiUploadInspectionPhotos(this.files)" style="display:none"><div class="ops-actions" style="margin-top:8px"><button type="button" class="primary" onclick="document.getElementById('hi_camera_input').click()">📷 Open camera / add photos</button><button type="button" class="secondary" onclick="document.getElementById('hi_gallery_input').click()">Choose from gallery</button><input id="hi_gallery_input" type="file" accept="image/*" multiple onchange="hiUploadInspectionPhotos(this.files)" style="display:none"></div><div id="hi_photo_status" class="muted" style="margin-top:10px">No photos uploaded yet.</div><div id="hi_photo_list" class="inspection-photo-list"></div></div><div class="field"><label><input id="hi_ack" type="checkbox" style="width:auto;margin-right:7px"> Guest acknowledged the recorded condition</label></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button id="hi_save_btn" class="primary" onclick="saveRentalInspection()">Save inspection</button></div>`)}
function hiRenderPhotos(){const list=document.getElementById('hi_photo_list'),status=document.getElementById('hi_photo_status');if(!list||!status)return;list.innerHTML=hiUploadedPhotos.map((p,i)=>`<div class="inspection-photo-item"><span>📷 ${esc(p.name)}</span><span class="oktext">Uploaded</span><button type="button" class="secondary" onclick="hiRemovePhoto(${i})">Remove</button></div>`).join('');status.textContent=hiUploadBusy?'Uploading photos…':`${hiUploadedPhotos.length} photo${hiUploadedPhotos.length===1?'':'s'} uploaded and ready to save.`;const b=document.getElementById('hi_booking'),t=document.getElementById('hi_type');if(b)b.disabled=hiUploadedPhotos.length>0||hiUploadBusy;if(t)t.disabled=hiUploadedPhotos.length>0||hiUploadBusy}
async function hiUploadInspectionPhotos(fileList){const files=Array.from(fileList||[]);if(!files.length)return;const booking=document.getElementById('hi_booking')?.value,type=document.getElementById('hi_type')?.value;if(!booking||!type){alert('Choose the booking and inspection type first.');return}hiUploadBusy=true;hiRenderPhotos();const status=document.getElementById('hi_photo_status');if(status)status.textContent='Uploading photos…';for(const file of files){if(!file.type.startsWith('image/')){alert(`${file.name} is not an image and was skipped.`);continue}if(file.size>10*1024*1024){alert(`${file.name} is over 10 MB. Please choose a smaller photo.`);continue}const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${booking}/${type}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {data,error}=await sb.storage.from('rental-inspections').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(error){alert(`Could not upload ${file.name}: ${error.message}. Run the inspection photo storage SQL setup and try again.`);continue}hiUploadedPhotos.push({path,name:file.name});hiRenderPhotos()}hiUploadBusy=false;hiRenderPhotos();const input=document.getElementById('hi_camera_input'),gallery=document.getElementById('hi_gallery_input');if(input)input.value='';if(gallery)gallery.value=''}
async function hiRemovePhoto(index){const photo=hiUploadedPhotos[index];if(!photo)return;const {error}=await sb.storage.from('rental-inspections').remove([photo.path]);if(error){alert('Photo could not be removed from storage: '+error.message);return}hiUploadedPhotos.splice(index,1);hiRenderPhotos()}
async function saveRentalInspection(){if(hiUploadBusy)return alert('Please wait until photo uploads finish.');const val=id=>document.getElementById(id).value;const fuel=val('hi_fuel')===''?null:Number(val('hi_fuel'));if(!val('hi_booking'))return alert('Select a booking.');if(fuel!==null&&(fuel<0||fuel>100))return alert('Fuel level must be between 0 and 100.');const payload={booking_id:val('hi_booking'),unit_id:val('hi_unit')||null,check_type:val('hi_type'),odometer_km:val('hi_odo')===''?null:Number(val('hi_odo')),fuel_percent:fuel,condition_rating:val('hi_condition'),damage_notes:val('hi_damage').trim()||null,photo_urls:hiUploadedPhotos.map(p=>p.path),guest_acknowledged:document.getElementById('hi_ack').checked,checked_by:me.id};const btn=document.getElementById('hi_save_btn');if(btn){btn.disabled=true;btn.textContent='Saving…'}const r=await sb.from('rental_handover_checks').insert(payload);if(r.error){if(btn){btn.disabled=false;btn.textContent='Save inspection'}return alert(r.error.message)}if(payload.unit_id){const unitPatch={condition_status:payload.condition_rating,updated_at:new Date().toISOString()};if(payload.odometer_km!==null)unitPatch.odometer_km=payload.odometer_km;if(payload.condition_rating==='needs_repair')unitPatch.status='maintenance';const u=await sb.from('rental_units').update(unitPatch).eq('id',payload.unit_id);if(u.error)alert('Inspection saved, but unit update failed: '+u.error.message)}hiUploadedPhotos=[];closeModal();rentalInspections()}
async function rentalFinance(){const [bs,records]=await Promise.all([sb.from('rental_bookings').select('id,reference,product_name,guest_name,total_price,security_deposit_total,payment_status,status,created_at').order('created_at',{ascending:false}).limit(300),sb.from('rental_payment_records').select('*').order('created_at',{ascending:false}).limit(500)]);if(bs.error||records.error){document.getElementById('content').innerHTML=msg('Rental payment ledger unavailable. Apply the operations upgrade migration first.',true);return}const payments=records.data||[],bookings=bs.data||[];const calc=b=>{const r=payments.filter(p=>p.booking_id===b.id);const paid=r.filter(p=>p.payment_type==='rental').reduce((a,p)=>a+Number(p.amount),0),refund=r.filter(p=>p.payment_type==='rental_refund').reduce((a,p)=>a+Number(p.amount),0),deposit=r.filter(p=>p.payment_type==='deposit').reduce((a,p)=>a+Number(p.amount),0),depositRefund=r.filter(p=>p.payment_type==='deposit_refund').reduce((a,p)=>a+Number(p.amount),0);return {paid:Math.max(0,paid-refund),deposit:Math.max(0,deposit-depositRefund),due:Math.max(0,Number(b.total_price||0)-paid+refund)}};document.getElementById('content').innerHTML=`<div class="ops-hero"><h2>Rental payments & balances</h2><p>Keep rental charges, refundable security deposits and refunds recorded separately. This is a ledger; it does not process card payments or issue refunds automatically.</p></div><div class="section"><div class="section-head"><h2>Rental booking balances</h2></div>${table(['Reference','Guest / rental','Rental total','Rental paid','Deposit recorded','Balance','Status','Actions'],bookings.map(b=>{const c=calc(b);return `<tr><td><b>${esc(b.reference)}</b></td><td>${esc(b.guest_name)}<div class="muted">${esc(b.product_name)}</div></td><td>${money(b.total_price)}</td><td>${money(c.paid)}</td><td>${money(c.deposit)}</td><td>${money(c.due)}</td><td>${badge(b.payment_status)}</td><td><button class="secondary" onclick="rentalPaymentForm('${b.id}')">Record payment</button></td></tr>`}).join(''))}</div><div class="section"><div class="section-head"><h2>Recent ledger entries</h2></div>${table(['When','Reference','Type','Amount','Method','Recorded by / notes'],payments.map(p=>`<tr><td>${fmtDate(p.created_at)}</td><td>${esc(bookings.find(b=>b.id===p.booking_id)?.reference||'—')}</td><td>${badge(p.payment_type)}</td><td>${money(p.amount)}</td><td>${esc(p.payment_method)}</td><td>${esc(p.notes||p.payment_reference||'—')}</td></tr>`).join(''))}</div>`}
async function rentalPaymentForm(id){const {data:b,error}=await sb.from('rental_bookings').select('id,reference,guest_name,total_price,security_deposit_total').eq('id',id).single();if(error)return alert(error.message);openModal('Record rental payment',`<div class="notice">Booking <b>${esc(b.reference)}</b> · ${esc(b.guest_name)}<br>Rental charge: ${money(b.total_price)} · Security deposit target: ${money(b.security_deposit_total)}</div><div class="ops-form-grid"><div class="field"><label>Entry type</label><select id="rp_type"><option value="rental">Rental payment</option><option value="deposit">Security deposit received</option><option value="rental_refund">Rental refund paid</option><option value="deposit_refund">Security deposit refund paid</option></select></div><div class="field"><label>Amount (USD) *</label><input id="rp_amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Method</label><select id="rp_method"><option value="cash">Cash</option><option value="card">Card</option><option value="bank_transfer">Bank transfer</option><option value="online">Online</option><option value="other">Other</option></select></div><div class="field"><label>Reference</label><input id="rp_reference"></div></div><div class="field"><label>Notes</label><textarea id="rp_notes"></textarea></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveRentalPayment('${id}')">Save entry</button></div>`)}
async function saveRentalPayment(id){const amount=Number(document.getElementById('rp_amount').value||0);if(amount<=0)return alert('Enter an amount greater than zero.');const type=document.getElementById('rp_type').value;const r=await sb.from('rental_payment_records').insert({booking_id:id,payment_type:type,amount,payment_method:document.getElementById('rp_method').value,payment_reference:document.getElementById('rp_reference').value.trim()||null,notes:document.getElementById('rp_notes').value.trim()||null,recorded_by:me.id});if(r.error)return alert(r.error.message);if(type==='rental'||type==='rental_refund'){const {data:entries}=await sb.from('rental_payment_records').select('payment_type,amount').eq('booking_id',id);const paid=(entries||[]).filter(x=>x.payment_type==='rental').reduce((a,x)=>a+Number(x.amount),0),refund=(entries||[]).filter(x=>x.payment_type==='rental_refund').reduce((a,x)=>a+Number(x.amount),0);const {data:b}=await sb.from('rental_bookings').select('total_price').eq('id',id).single();const status=Math.max(0,paid-refund)>=Number(b?.total_price||0)?'paid':Math.max(0,paid-refund)>0?'partial':'unpaid';await sb.from('rental_bookings').update({payment_status:status}).eq('id',id)}closeModal();rentalFinance()}
async function notifications(){const [n,a,issues]=await Promise.all([sb.from('protrack_notifications').select('*').order('created_at',{ascending:false}).limit(150),sb.from('protrack_audit_log').select('*').order('occurred_at',{ascending:false}).limit(100),sb.from('driver_issue_reports').select('*').order('created_at',{ascending:false}).limit(100)]);if(n.error||a.error){document.getElementById('content').innerHTML=msg('Notification and audit tables unavailable. Apply protrack_operations_upgrade.sql first.',true);return}const notes=n.data||[],audit=a.data||[];document.getElementById('content').innerHTML=`<div class="ops-hero"><h2>Notification center</h2><p>New requests and booking status changes are collected here. Audit history helps identify who changed what and when on rental bookings, products and fleet units.</p><div class="ops-actions"><button class="secondary" onclick="markAllNotificationsRead()">Mark all read</button></div></div><div class="section"><div class="section-head"><h2>Notifications (${notes.filter(x=>!x.read_at).length} unread)</h2></div>${notes.length?notes.map(x=>`<div class="ops-alert"><div><div class="ops-alert-title">${x.severity==='urgent'?'🚨 ':x.severity==='warning'?'⚠️ ':'🔔 '}${esc(x.title)} ${x.read_at?'':'<span class="badge warn">NEW</span>'}</div><div class="ops-alert-meta">${esc(x.message)}<br>${fmtDate(x.created_at)}</div></div><div class="toolbar">${x.entity_type==='rental_booking'?`<button class="secondary" onclick="showPage('rentalBookings')">Open</button>`:x.entity_type==='transport_request'?`<button class="secondary" onclick="showPage('transport')">Open</button>`:x.entity_type==='rental_unit'?`<button class="secondary" onclick="showPage('fleetUnits')">Open fleet</button>`:x.entity_type==='guest_booking'?`<button class="secondary" onclick="showPage('activityBookings')">Open</button>`:''}${!x.read_at?`<button class="secondary" onclick="markNotificationRead('${x.id}')">Mark read</button>`:''}</div></div>`).join(''):'<div class="empty">No notifications yet.</div>'}</div><div class="section"><div class="section-head"><h2>Driver issue reports (${(issues.data||[]).filter(x=>x.status==='open').length} open)</h2><button class="secondary" onclick="showPage('issueReports')">Manage issues</button></div>${(issues.data||[]).length?(issues.data||[]).slice(0,15).map(x=>`<div class="ops-alert"><div><div class="ops-alert-title">${x.severity==='urgent'?'🚨 ':''}${esc(x.issue_type)} · ${badge(x.status)}</div><div class="ops-alert-meta">${esc(x.description)}<br>${fmtDate(x.created_at)}</div></div></div>`).join(''):'<div class="empty">No driver issues reported.</div>'}</div><div class="section"><div class="section-head"><h2>Recent audit history</h2></div>${table(['When','Table','Record','Action','Actor'],audit.map(x=>`<tr><td>${fmtDate(x.occurred_at)}</td><td>${esc(x.table_name)}</td><td>${esc(x.record_id||'—')}</td><td>${badge(x.action)}</td><td>${esc(x.actor_id||'system / trigger')}</td></tr>`).join(''))}</div>`}
async function markNotificationRead(id){const r=await sb.from('protrack_notifications').update({read_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);notifications()}
async function markAllNotificationsRead(){const r=await sb.from('protrack_notifications').update({read_at:new Date().toISOString()}).is('read_at',null);if(r.error)return alert(r.error.message);notifications()}
async function issueReports(){const r=await sb.from('driver_issue_reports').select('*,profiles:driver_id(full_name)').order('created_at',{ascending:false}).limit(250);if(r.error){document.getElementById('content').innerHTML=msg('Issue reports unavailable. Apply the operations upgrade migration first.',true);return}document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Driver issue reports</h2><button class="secondary" onclick="showPage('notifications')">Notification center</button></div>${table(['When','Driver','Type / Severity','Description','Location','Status','Action'],(r.data||[]).map(x=>`<tr><td>${fmtDate(x.created_at)}</td><td>${esc(x.profiles?.full_name||x.driver_id)}</td><td>${badge(x.issue_type)} ${x.severity==='urgent'?'<span class="status-chip urgent">URGENT</span>':''}</td><td>${esc(x.description)}</td><td>${esc(x.location_text||'—')}</td><td>${badge(x.status)}</td><td><select id="issue_status_${x.id}"><option value="open" ${x.status==='open'?'selected':''}>open</option><option value="in_review" ${x.status==='in_review'?'selected':''}>in review</option><option value="resolved" ${x.status==='resolved'?'selected':''}>resolved</option></select> <button class="secondary" onclick="updateIssue('${x.id}')">Save</button></td></tr>`).join(''))}</div>`}
async function updateIssue(id){const status=document.getElementById('issue_status_'+id).value;const r=await sb.from('driver_issue_reports').update({status,resolved_at:status==='resolved'?new Date().toISOString():null}).eq('id',id);if(r.error)return alert(r.error.message);issueReports()}
async function rentalAssignUnit(bookingId){const {data:b,error}=await sb.from('rental_bookings').select('id,product_id,quantity,rental_unit_id,reference,status,start_at,end_at').eq('id',bookingId).single();if(error)return alert(error.message);const [{data:units,error:ue},{data:assigned,error:ae}]=await Promise.all([sb.from('rental_units').select('id,unit_code,status,registration_number').eq('product_id',b.product_id).eq('status','active').order('unit_code'),sb.from('rental_booking_unit_assignments').select('unit_id').eq('booking_id',bookingId)]);if(ue||ae)return alert((ue||ae).message);const selected=new Set((assigned||[]).map(x=>x.unit_id));if(!selected.size&&b.rental_unit_id)selected.add(b.rental_unit_id);openModal('Assign individual vehicle(s)',`<div class="notice">Booking ${esc(b.reference)} · quantity ${b.quantity}. Select up to ${b.quantity} individual units. The server checks the full booking period against existing assignments and maintenance blocks.</div><div class="field"><label>Assigned units</label><select id="ra_units" multiple size="${Math.min(8,Math.max(3,(units||[]).length))}" style="min-height:140px">${(units||[]).map(u=>`<option value="${u.id}" ${selected.has(u.id)?'selected':''}>${esc(u.unit_code)} ${u.registration_number?'· '+esc(u.registration_number):''}</option>`).join('')}</select><div class="muted">Use Ctrl (Windows) or Command (Mac) to select multiple units. You may leave this blank to keep the booking unassigned.</div></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveRentalUnitAssignment('${bookingId}',${b.quantity})">Save assignment</button></div>`)}
async function saveRentalUnitAssignment(id,quantity){const selected=[...document.getElementById('ra_units').selectedOptions].map(x=>x.value);if(selected.length>quantity)return alert(`This booking is for ${quantity} vehicle(s). Select no more than ${quantity}.`);const {data,error}=await sb.rpc('assign_rental_booking_units',{p_booking_id:id,p_unit_ids:selected});if(error)return alert(error.message);closeModal();rentalBookings()}
const pages={dashboard,dispatch,trips,live,drivers,guests,properties,vehicles,rentalProducts,rentalBookings,rentalCalendar,fleetUnits,rentalMaintenance,rentalInspections,rentalFinance,notifications,issueReports,activities,categories,providers,activityBookings,activityPaymentSettings,payments,outstanding,cash,expenses,reports,pricing,destinations,transport};
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload()});
init();
</script>
