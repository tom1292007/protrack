<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTrack Management</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#718096;--line:#e4e9f0;--brand:#1456d9;--brand2:#0b3eaa;--danger:#c62828;--ok:#138a52;--warn:#a76500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 16px 50px #17345a12}
.logo{font-size:26px;font-weight:800;letter-spacing:-.7px}.sub{color:var(--muted);margin-top:5px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d8dee8;border-radius:10px;background:#fff}.field textarea{min-height:85px;resize:vertical}
.primary{background:var(--brand);color:#fff;padding:11px 15px;border-radius:10px;font-weight:700}.primary:hover{background:var(--brand2)}.secondary{background:#edf2f8;color:#26364d;padding:9px 13px;border-radius:9px;font-weight:700}.danger{background:#fff0f0;color:var(--danger);padding:8px 11px;border-radius:8px;font-weight:700}.success{background:#eaf8f1;color:var(--ok);padding:8px 11px;border-radius:8px;font-weight:700}
.app{display:flex;min-height:100vh}.side{width:245px;background:#101a2c;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{padding:4px 10px 22px;font-size:23px;font-weight:800}.brand small{display:block;color:#8fa1bf;font-size:11px;margin-top:3px}.nav-group{margin:17px 0 7px 10px;color:#7083a3;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1px}.nav button{width:100%;text-align:left;background:transparent;color:#d9e1ef;padding:10px 12px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#1b2a45;color:#fff}.main{margin-left:245px;flex:1;padding:25px;max-width:1700px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:25px}.top-right{display:flex;gap:9px;align-items:center}.user-pill{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:#52627a}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.metric{font-size:25px;font-weight:800;margin-top:6px}.muted{color:var(--muted)}.section{background:#fff;border:1px solid var(--line);border-radius:13px;margin-top:16px;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}.section-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{padding:9px 10px;border:1px solid #d8dee8;border-radius:9px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf0f4;vertical-align:middle}.table th{font-size:11px;color:#748198;text-transform:uppercase;letter-spacing:.4px;background:#fbfcfe}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f8;color:#45556d;font-size:11px;font-weight:800}.badge.ok{background:#e7f7ef;color:#117a49}.badge.warn{background:#fff3df;color:#9b6100}.badge.bad{background:#ffe9e9;color:#b72c2c}
.empty{padding:30px;text-align:center;color:var(--muted)}.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px}.check-item{font-size:13px;padding:7px}.activity-image-row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;margin-bottom:8px}.activity-image-row input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px;margin:2px}.detail-gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px}.detail-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modal{position:fixed;inset:0;background:#09111c80;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{margin:0;font-size:19px}.x{background:#edf2f8;border-radius:8px;padding:6px 10px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.notice{padding:11px 13px;border-radius:9px;margin:10px 0;background:#eef5ff;color:#27528c}.error{background:#fff0f0;color:#b22b2b}.oktext{color:var(--ok);font-weight:700}
.kpi-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{padding:12px;background:#f7f9fc;border-radius:10px}.mini b{display:block;font-size:18px;margin-top:3px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.side{width:210px}.main{margin-left:210px}}
@media(max-width:700px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;padding:15px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.cards,.grid2,.grid3,.check-grid,.detail-gallery{grid-template-columns:1fr}.activity-image-row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.table{min-width:650px}}

/* Transport pricing workspace refresh */
.transport-workspace-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px;background:linear-gradient(120deg,#10213b,#173a67);color:#fff;border-radius:18px;margin:14px 0 18px;box-shadow:0 12px 30px #10213b16}
.transport-workspace-intro h2{margin:0 0 6px;font-size:21px;letter-spacing:-.5px}.transport-workspace-intro p{margin:0;color:#c6d5e9;line-height:1.6;max-width:720px}.transport-workspace-intro .workspace-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffffff2b;background:#ffffff12;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.transport-stepbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px}.transport-stepcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-width:0}.transport-stepcard .stepnum{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:11px;background:#e9f1ff;color:#1456d9;font-weight:900}.transport-stepcard b{display:block;font-size:13px}.transport-stepcard small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}
.transport-section{border-radius:17px;box-shadow:0 4px 18px #17203306;margin-top:14px}.transport-section .section-head{padding:18px 20px;background:linear-gradient(180deg,#fff,#fcfdff)}.transport-section .section-head h2{font-size:16px;letter-spacing:-.2px}.transport-section .section-body{padding:18px 20px}.transport-section .section-description{font-size:12px;color:var(--muted);line-height:1.55;margin-top:5px;max-width:760px}.transport-inline-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;max-width:650px}.transport-inline-add input,.transport-search{width:100%;min-width:0;padding:11px 13px;border:1px solid #d8e0eb;border-radius:11px;background:#fbfcff;outline:none}.transport-inline-add input:focus,.transport-search:focus{border-color:#80a7f7;box-shadow:0 0 0 4px #1456d911;background:#fff}.transport-list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0}.transport-search-wrap{position:relative;flex:1;min-width:220px;max-width:420px}.transport-search-wrap:before{content:'⌕';position:absolute;left:12px;top:7px;color:#7c8ba2;font-size:20px}.transport-search{padding-left:37px}.transport-count{font-size:12px;color:var(--muted);font-weight:700}.transport-zone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.transport-zone-card,.transport-fare-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;min-width:0;transition:box-shadow .18s,border-color .18s}.transport-zone-card:hover,.transport-fare-card:hover{border-color:#c5d4ed;box-shadow:0 8px 22px #18365c0b}.transport-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.transport-card-title{font-size:14px;font-weight:850;overflow-wrap:anywhere}.transport-card-sub{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}.transport-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid #edf0f5}.transport-card-actions button{font-size:11px;padding:7px 9px}.transport-zone-count{display:inline-flex;align-items:center;gap:6px;background:#f1f5fc;color:#385477;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;margin-top:13px}.transport-fare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.transport-fare-card{padding:17px}.transport-fare-route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:850;font-size:13px}.transport-fare-zone{background:#edf3ff;color:#204d9c;border-radius:9px;padding:7px 9px}.transport-fare-arrow{color:#8090a8;font-size:17px}.transport-fare-price-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.transport-fare-price{background:#f7f9fc;border:1px solid #edf1f6;border-radius:11px;padding:11px}.transport-fare-price small{display:block;font-size:10px;color:var(--muted);line-height:1.35}.transport-fare-price strong{display:block;font-size:21px;letter-spacing:-.5px;margin-top:4px}.transport-fare-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;font-size:11px;color:var(--muted)}.transport-section .field label{font-size:12px;color:#3b4b62}.transport-form-panel{background:#f7f9fd;border:1px solid #e5ebf4;border-radius:14px;padding:16px;margin-bottom:15px}.transport-form-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.transport-form-panel-head b{font-size:13px}.transport-form-panel-head span{font-size:11px;color:var(--muted)}
@media(max-width:1100px){.transport-zone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.transport-workspace-intro{padding:17px;display:block}.transport-workspace-intro .workspace-chip{margin-top:14px}.transport-stepbar{grid-template-columns:1fr}.transport-zone-grid,.transport-fare-grid{grid-template-columns:1fr}.transport-section .section-body{padding:14px}.transport-section .section-head{padding:15px}.transport-inline-add{grid-template-columns:1fr}.transport-fare-price strong{font-size:19px}}

</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">ProTrack</div><div class="sub">Management Command Center</div>
    <div id="loginMsg"></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="primary" style="width:100%" onclick="login()">Sign in</button>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="side">
  <div class="brand">ProTrack<small>OPERATIONS PLATFORM</small></div>
  <div class="nav">
    <div class="nav-group">Operations</div>
    <button data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button>
    <button data-page="dispatch" onclick="showPage('dispatch')">Dispatch</button>
    <button data-page="trips" onclick="showPage('trips')">Trips</button>
    <button data-page="live" onclick="showPage('live')">Live Drivers</button>
    <div class="nav-group">People</div>
    <button data-page="drivers" onclick="showPage('drivers')">Drivers</button>
    <button data-page="guests" onclick="showPage('guests')">Guests</button>
    <button data-page="properties" onclick="showPage('properties')">Properties</button>
    <div class="nav-group">Fleet</div>
    <button data-page="vehicles" onclick="showPage('vehicles')">Vehicles</button>
    <div class="nav-group">Transportation</div>
    <button data-page="transport" onclick="showPage('transport')">Transport Requests & Setup</button>
    <div class="nav-group">Activities</div>
    <button data-page="activities" onclick="showPage('activities')">Activities</button>
    <button data-page="categories" onclick="showPage('categories')">Categories</button>
    <button data-page="providers" onclick="showPage('providers')">Providers</button>
    <button data-page="activityBookings" onclick="showPage('activityBookings')">Activity Bookings</button>
    <div class="nav-group">Finance</div>
    <button data-page="payments" onclick="showPage('payments')">Payments</button>
    <button data-page="outstanding" onclick="showPage('outstanding')">Outstanding</button>
    <button data-page="cash" onclick="showPage('cash')">Driver Cash</button>
    <button data-page="expenses" onclick="showPage('expenses')">Expenses</button>
    <button data-page="reports" onclick="showPage('reports')">Reports</button>
    <div class="nav-group">Settings</div>
    <button data-page="activityPaymentSettings" onclick="showPage('activityPaymentSettings')">Activity Payment Settings</button>
    <button data-page="pricing" onclick="showPage('pricing')">Pricing</button>
    <button data-page="destinations" onclick="showPage('destinations')">Destinations</button>
    <button onclick="logout()">Sign out</button>
  </div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="pageSub">Today’s operations</div></div><div class="top-right"><span class="user-pill" id="userName"></span></div></div>
  <div id="content"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>

<script>
const cfg=window.PROTRACK_CONFIG||{};
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
let me=null, profile=null, currentPage='dashboard';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>'$'+Number(v||0).toFixed(2);
const fmtDate=v=>v?new Date(v).toLocaleString([], {dateStyle:'short',timeStyle:'short'}):'—';
const dateOnly=v=>v?new Date(v).toLocaleDateString(): '—';
const badge=s=>{let c=['completed','paid','active','accepted'].includes(s)?'ok':['requested','scheduled','assigned','partial','collect_on_return'].includes(s)?'warn':['cancelled','unpaid','rejected'].includes(s)?'bad':'';return `<span class="badge ${c}">${esc(s||'—')}</span>`};
function msg(text,err=false){return `<div class="notice ${err?'error':''}">${esc(text)}</div>`}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await boot(session.user); else document.getElementById('login').classList.remove('hidden');
}
async function login(){
  const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
  const el=document.getElementById('loginMsg'); el.innerHTML='';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){el.innerHTML=msg(error.message,true);return}
  await boot(data.user);
}
async function boot(user){
  me=user;
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error||!p){await sb.auth.signOut();document.getElementById('loginMsg').innerHTML=msg('No ProTrack profile was found for this account.',true);return}
  if(!p.active||!['admin','manager','dispatcher'].includes(p.role)){await sb.auth.signOut();document.getElementById('loginMsg').innerHTML=msg('This account does not have management access.',true);return}
  profile=p; document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent=p.full_name||user.email;
  showPage('dashboard');
}
async function logout(){await sb.auth.signOut();location.reload()}
function showPage(page){
  currentPage=page; document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const titles={dashboard:['Dashboard','Today’s operations'],dispatch:['Dispatch','Assign and manage today’s trips'],trips:['Trips','All transportation trips'],live:['Live Drivers','Current driver locations'],drivers:['Drivers','Manage driver profiles and access'],guests:['Guests','Manage guest profiles'],properties:['Properties','Manage partner properties'],vehicles:['Vehicles','Manage fleet'],activities:['Activities','Manage activities and catalog'],categories:['Categories','Activity categories'],providers:['Providers','Activity providers'],activityBookings:['Activity Bookings','Manage activity reservations'],activityPaymentSettings:['Activity Payment Settings','Set the default activity deposit percentage'],payments:['Payments','All recorded payments'],outstanding:['Outstanding','Unpaid and return-leg balances'],cash:['Driver Cash','Cash sessions and reconciliation'],expenses:['Expenses','Driver expenses'],pricing:['Pricing','Transfer pricing rules'],destinations:['Destinations','Service destinations and zones'],reports:['Reports','Revenue, operations and financial analytics'],transport:['Transport Requests & Setup','Manage guest transfer requests, route fares and shuttle settings']};
  document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];
  const fn=pages[page]; if(fn) fn();
}
async function q(table,select='*'){const r=await sb.from(table).select(select);if(r.error)throw r.error;return r.data||[]}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function save(table,id,data,refresh=true){
  let r=id?await sb.from(table).update(data).eq('id',id):await sb.from(table).insert(data);
  if(r.error){alert(r.error.message);return false}closeModal();if(refresh) showPage(currentPage);return true
}
function toggle(id,table,field,current){return save(table,id,{[field]:!current})}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="'+headers.length+'" class="empty">No records found.</td></tr>'}</tbody></table></div>`}
async function dashboard(){
  const today=new Date();const start=new Date(today);start.setHours(0,0,0,0);const end=new Date(today);end.setHours(23,59,59,999);
  const [tr,pa,op,drivers]=await Promise.all([
    sb.from('trips').select('id,status,price,payment_status,scheduled_at').gte('scheduled_at',start.toISOString()).lte('scheduled_at',end.toISOString()),
    sb.from('payments').select('amount').gte('collected_at',start.toISOString()).lte('collected_at',end.toISOString()),
    sb.from('outstanding_payments').select('amount_due,amount_collected,status'),
    sb.from('profiles').select('id,full_name,active,role').eq('role','driver')
  ]);
  const trips=tr.data||[],payments=pa.data||[],outs=op.data||[];
  const revenue=trips.reduce((a,x)=>a+Number(x.price||0),0),collected=payments.reduce((a,x)=>a+Number(x.amount||0),0),outstanding=outs.filter(x=>x.status!=='paid').reduce((a,x)=>a+Math.max(0,Number(x.amount_due||0)-Number(x.amount_collected||0)),0);
  document.getElementById('content').innerHTML=`<div class="cards">
  <div class="card"><div class="muted">Today’s Trips</div><div class="metric">${trips.length}</div></div>
  <div class="card"><div class="muted">Completed</div><div class="metric">${trips.filter(x=>x.status==='completed').length}</div></div>
  <div class="card"><div class="muted">Trip Value</div><div class="metric">${money(revenue)}</div></div>
  <div class="card"><div class="muted">Payments Collected</div><div class="metric">${money(collected)}</div></div>
  </div>
  <div class="cards" style="margin-top:13px">
  <div class="card"><div class="muted">Outstanding</div><div class="metric">${money(outstanding)}</div></div>
  <div class="card"><div class="muted">Unassigned</div><div class="metric">${trips.filter(x=>x.status==='scheduled').length}</div></div>
  <div class="card"><div class="muted">Active Drivers</div><div class="metric">${drivers.filter(x=>x.active).length}</div></div>
  <div class="card"><div class="muted">Cancelled</div><div class="metric">${trips.filter(x=>x.status==='cancelled').length}</div></div></div>
  <div class="section"><div class="section-head"><h2>Today’s Trips</h2><button class="secondary" onclick="showPage('dispatch')">Open Dispatch</button></div>${table(['Time','Status','Pickup','Destination','Value'],trips.sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at)).map(x=>`<tr><td>${fmtDate(x.scheduled_at)}</td><td>${badge(x.status)}</td><td>—</td><td>—</td><td>${money(x.price)}</td></tr>`).join(''))}</div>`;
}
async function dispatch(){
  const {data,error}=await sb.from('trips').select(`*,trip_assignments(id,driver_id,assignment_status,profiles:driver_id(full_name))`).order('scheduled_at');
  if(error){document.getElementById('content').innerHTML=msg(error.message,true);return}
  const drivers=await q('profiles','id,full_name,active,role').then(x=>x.filter(d=>d.role==='driver'&&d.active));
  document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Dispatch Board</h2><button class="primary" onclick="tripForm()">+ New Trip</button></div>${table(['Time','Booking','Route','Pax','Driver','Status','Actions'],(data||[]).map(t=>{
    const a=t.trip_assignments?.[0],d=a?.profiles?.full_name||'Unassigned';
    return `<tr><td>${fmtDate(t.scheduled_at)}</td><td><b>${esc(t.booking_reference)}</b></td><td>${esc(t.pickup_location)} → ${esc(t.destination_location)}</td><td>${t.passenger_count}</td><td>${esc(d)}</td><td>${badge(t.status)}</td><td><button class="secondary" onclick="assignTrip('${t.id}')">Assign</button> <button class="secondary" onclick="advanceTrip('${t.id}','${t.status}')">Advance</button></td></tr>`
  }).join(''))}</div>`;
}
async function trips(){
 const {data,error}=await sb.from('trips').select('*').order('scheduled_at',{ascending:false});

async function createTrip(){
 const ref=document.getElementById('f_ref').value.trim()||'PT-'+Math.random().toString(36).slice(2,9).toUpperCase();
 const payload={booking_reference:ref,scheduled_at:new Date(document.getElementById('f_time').value||Date.now()).toISOString(),pickup_location:document.getElementById('f_pickup').value,destination_location:document.getElementById('f_dest').value,passenger_count:Number(document.getElementById('f_pax').value||1),price:Number(document.getElementById('f_price').value||0),payment_status:document.getElementById('f_pay').value,special_instructions:document.getElementById('f_notes').value,created_by:me.id,status:'scheduled'};
 const r=await sb.from('trips').insert(payload).select('id').single();if(r.error){alert(r.error.message);return}
 const driver=document.getElementById('f_driver').value;if(driver){const a=await sb.from('trip_assignments').insert({trip_id:r.data.id,driver_id:driver,assignment_status:'assigned'});if(a.error)alert(a.error.message);else await sb.from('trips').update({status:'assigned'}).eq('id',r.data.id)}
 closeModal();showPage('dispatch');
}
async function assignTrip(id){
 const drivers=await q('profiles','id,full_name,active,role').then(x=>x.filter(d=>d.role==='driver'&&d.active));
 openModal('Assign Driver',`<div class="field"><label>Driver</label><select id="assign_driver">${drivers.map(d=>`<option value="${d.id}">${esc(d.full_name)}</option>`).join('')}</select></div><div class="form-actions"><button class="primary" onclick="saveAssignment('${id}')">Assign</button></div>`);
}
async function saveAssignment(trip){
 const d=document.getElementById('assign_driver').value;
 await sb.from('trip_assignments').delete().eq('trip_id',trip);
 const r=await sb.from('trip_assignments').insert({trip_id:trip,driver_id:d,assignment_status:'assigned'});
 if(r.error){alert(r.error.message);return}await sb.from('trips').update({status:'assigned'}).eq('id',trip);closeModal();showPage('dispatch');
}

async function saveDriver(existingId){
 const name=document.getElementById('d_name').value.trim();
 const phone=document.getElementById('d_phone').value.trim();
 const role=document.getElementById('d_role').value;
 const driver_access=document.getElementById('d_access').value==='true';
 if(!name){alert('Enter the driver name.');return}
 if(existingId){
   const r=await sb.from('profiles').update({full_name:name,phone,role,driver_access,active:true}).eq('id',existingId);
   if(r.error){alert(r.error.message);return}
   closeModal();showPage('drivers');
   return;
 }
 const email=document.getElementById('d_email').value.trim();
 const password=document.getElementById('d_password').value;
 if(!email){alert('Enter the driver email address.');return}
 if(password.length<8){alert('Use a temporary password with at least 8 characters.');return}
 const button=document.querySelector('#modalBody .primary');
 if(button){button.disabled=true;button.textContent='Creating…'}
 const {data,error}=await sb.functions.invoke('create-driver',{body:{email,password,full_name:name,phone,role,driver_access}});
 if(error){
   let message=error.message||'Could not create driver.';
   try{if(error.context){const body=await error.context.json();if(body?.error)message=body.error}}catch(_){}
   alert(message);
   if(button){button.disabled=false;button.textContent='Create Driver'}
   return;
 }
 closeModal();
 alert(`Driver ${name} was created successfully.\n\nLogin email: ${email}`);
 showPage('drivers');
}

async function activities(){
 try{
  const [ar,lr,cr]=await Promise.all([
   sb.from('activities').select('*').order('name'),
   sb.from('activity_category_links').select('activity_id,category_id'),
   sb.from('activity_categories').select('id,name,active').eq('active',true).order('name')
  ]);
  const err=[ar,lr,cr].find(x=>x.error);
  if(err){document.getElementById('content').innerHTML=msg('Could not load activities: '+err.error.message,true);return}
  const acts=ar.data||[], links=lr.data||[], categoriesList=cr.data||[];
  const catNames=Object.fromEntries(categoriesList.map(c=>[c.id,c.name]));
  const cats={};
  links.forEach(x=>{if(!cats[x.activity_id])cats[x.activity_id]=[];if(catNames[x.category_id])cats[x.activity_id].push(catNames[x.category_id])});
  // Preserve the original single category assignment for older activities that were created before multi-category support.
  acts.forEach(a=>{if(!cats[a.id]?.length && a.category_id && catNames[a.category_id])cats[a.id]=[catNames[a.category_id]]});
  document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Activities</h2><button class="primary" onclick="activityForm()">+ Add Activity</button></div>${table(['Activity','Categories','Price','Guests','Transport','Active','Actions'],acts.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="muted">${esc(a.short_description||'')}</div></td><td>${(cats[a.id]||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'<span class="muted">—</span>'}</td><td>${money(a.price)} / ${esc(a.price_type)}</td><td>${a.minimum_guests}–${a.maximum_guests??'∞'}</td><td>${a.transportation_available?'Yes':'No'}</td><td>${badge(a.active?'active':'inactive')}</td><td><button class="secondary" onclick="activityFormById('${a.id}')">Edit</button></td></tr>`).join(''))}</div>`;
 }catch(e){document.getElementById('content').innerHTML=msg('Could not load activities: '+e.message,true)}
}

async function activityFormById(id){
  try{
    const [ar,lr,ir,cr,tr]=await Promise.all([
      sb.from('activities').select('*').eq('id',id).single(),
      sb.from('activity_category_links').select('category_id').eq('activity_id',id),
      sb.from('activity_images').select('*').eq('activity_id',id).order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
      sb.from('activity_categories').select('id,name,active').eq('active',true).order('name'),
      sb.from('activity_time_slots').select('*').eq('activity_id',id).order('sort_order',{ascending:true}).order('start_time',{ascending:true})
    ]);
    const err=[ar,lr,ir,cr,tr].find(x=>x.error);
    if(err){openModal('Could not edit activity',msg(err.error.message,true));return}
    const a=ar.data;
    a._categoryIds=(lr.data||[]).map(x=>x.category_id);
    a._images=ir.data||[];
    a._timeSlots=tr.data||[];
    activityForm(a,cr.data||[]);
  }catch(e){openModal('Could not edit activity',msg(e.message,true))}
}

function updateMainImagePosition(){
  const xEl=document.getElementById('a_image_position_x');
  const yEl=document.getElementById('a_image_position_y');
  if(!xEl||!yEl)return;
  const x=Math.max(0,Math.min(100,Number(xEl.value)||0));
  const y=Math.max(0,Math.min(100,Number(yEl.value)||0));
  const xl=document.getElementById('a_image_position_x_label');
  const yl=document.getElementById('a_image_position_y_label');
  if(xl)xl.textContent=x+'%';
  if(yl)yl.textContent=y+'%';
  document.querySelectorAll('#mainImageCardPreview,#mainImageDetailPreview').forEach(preview=>{
    preview.style.objectPosition=`${x}% ${y}%`;
  });
}
function updateMainImagePreview(){
  const url=document.getElementById('a_main_url')?.value.trim()||'';
  const cardPreview=document.getElementById('mainImageCardPreview');
  const detailPreview=document.getElementById('mainImageDetailPreview');
  const placeholder=document.getElementById('mainImageDetailPlaceholder');
  if(!cardPreview||!detailPreview)return;
  if(!url){
    cardPreview.removeAttribute('src');
    detailPreview.removeAttribute('src');
    cardPreview.style.display='none';
    detailPreview.style.display='none';
    if(placeholder)placeholder.style.display='grid';
    return;
  }
  if(cardPreview.getAttribute('src')!==url)cardPreview.src=url;
  if(detailPreview.getAttribute('src')!==url)detailPreview.src=url;
  cardPreview.style.display='block';
  detailPreview.style.display='block';
  if(placeholder)placeholder.style.display='none';
  updateMainImagePosition();
}
function resetMainImagePosition(){
  const x=document.getElementById('a_image_position_x');
  const y=document.getElementById('a_image_position_y');
  if(x)x.value='50';
  if(y)y.value='50';
  updateMainImagePosition();
}

async function saveActivityFull(id){
  const name=document.getElementById('a_name')?.value.trim();
  if(!name){alert('Please enter an activity name.');return}

  const depositInput=document.getElementById('a_deposit_percentage')?.value.trim();
  if(depositInput!=='' && (!Number.isFinite(Number(depositInput)) || Number(depositInput)<0 || Number(depositInput)>100)){alert('Deposit percentage must be between 0 and 100.');return}

  const categoryIds=[...document.querySelectorAll('.activity-category:checked')].map(x=>x.value);
  const timeSlotRows=[...document.querySelectorAll('.activity-time-slot-row')];
  const timeSlots=[];
  for(const row of timeSlotRows){
    const value=row.querySelector('.activity-time-slot-value')?.value||'';
    if(value)timeSlots.push({start_time:value,sort_order:timeSlots.length});
  }
  if(new Set(timeSlots.map(x=>x.start_time)).size!==timeSlots.length){alert('Please remove duplicate activity times.');return}

  const mainImageUrl=document.getElementById('a_main_url')?.value.trim()||null;

  const detailRows=[...document.querySelectorAll('.activity-image-row')];
  const imageRows=[];
  for(let i=0;i<detailRows.length;i++){
    const row=detailRows[i];
    const imageUrl=row.querySelector('.activity-image-url')?.value.trim()||null;
    if(imageUrl)imageRows.push({image_url:imageUrl,caption:row.querySelector('.activity-image-caption')?.value.trim()||null,sort_order:imageRows.length});
  }

  const data={
    name,
    image_url:mainImageUrl,
    image_position_x:Math.max(0,Math.min(100,Number(document.getElementById('a_image_position_x')?.value??50))),
    image_position_y:Math.max(0,Math.min(100,Number(document.getElementById('a_image_position_y')?.value??50))),
    category_id:categoryIds[0]||null,
    location:document.getElementById('a_location').value.trim()||null,
    duration_minutes:document.getElementById('a_duration').value?Number(document.getElementById('a_duration').value):null,
    activity_times:document.getElementById('a_activity_times').value.trim()||null,
    price:document.getElementById('a_price').value?Number(document.getElementById('a_price').value):null,
    price_type:document.getElementById('a_price_type').value,
    minimum_guests:Number(document.getElementById('a_min').value||1),
    maximum_guests:document.getElementById('a_max').value?Number(document.getElementById('a_max').value):null,
    pickup_available:document.getElementById('a_pickup').checked,
    transportation_available:document.getElementById('a_transport').checked,
    short_description:document.getElementById('a_short').value.trim()||null,
    description:document.getElementById('a_desc').value.trim()||null,
    terms_conditions:document.getElementById('a_terms').value.trim()||null,
    deposit_percentage:document.getElementById('a_deposit_percentage').value.trim()===''?null:Number(document.getElementById('a_deposit_percentage').value),
    active:document.getElementById('a_active').value==='true'
  };

  try{
    let activityId=id;
    let r;
    if(id){
      r=await sb.from('activities').update(data).eq('id',id).select('id').single();
    }else{
      r=await sb.from('activities').insert(data).select('id').single();
      activityId=r.data?.id;
    }
    if(r.error){openModal('Could not save activity',msg(r.error.message,true));return}

    const d1=await sb.from('activity_category_links').delete().eq('activity_id',activityId);
    if(d1.error){openModal('Could not save categories',msg(d1.error.message,true));return}
    if(categoryIds.length){
      const rows=categoryIds.map(category_id=>({activity_id:activityId,category_id}));
      const d2=await sb.from('activity_category_links').insert(rows);
      if(d2.error){openModal('Could not save categories',msg(d2.error.message,true));return}
    }

    const d3=await sb.from('activity_images').delete().eq('activity_id',activityId);
    if(d3.error){openModal('Could not save pictures',msg(d3.error.message,true));return}
    if(imageRows.length){
      const d4=await sb.from('activity_images').insert(imageRows.map(x=>({...x,activity_id:activityId})));
      if(d4.error){openModal('Could not save pictures',msg(d4.error.message,true));return}
    }

    const tsDelete=await sb.from('activity_time_slots').delete().eq('activity_id',activityId);
    if(tsDelete.error){openModal('Could not save activity times',msg(tsDelete.error.message,true));return}
    if(timeSlots.length){
      const tsInsert=await sb.from('activity_time_slots').insert(timeSlots.map(x=>({...x,activity_id:activityId})));
      if(tsInsert.error){openModal('Could not save activity times',msg(tsInsert.error.message,true));return}
    }

    closeModal();
    showPage('activities');
  }catch(e){openModal('Could not save activity',msg(e.message,true))}
}

function dateInput(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
async function loadReports(){
  const from=document.getElementById('rep_from')?.value, to=document.getElementById('rep_to')?.value;
  if(!from||!to)return; if(to<from){alert('The end date must be on or after the start date.');return}
  const start=new Date(from+'T00:00:00'), end=new Date(to+'T23:59:59.999');
  const body=document.getElementById('reportBody'); body.innerHTML='<div class="section"><div class="muted">Loading report…</div></div>';
  const [tr,pa,ex,cs,outs]=await Promise.all([
    sb.from('trips').select('id,booking_reference,scheduled_at,status,price,payment_status,payment_due_on_return,passenger_count,vehicle_id').gte('scheduled_at',start.toISOString()).lte('scheduled_at',end.toISOString()),
    sb.from('payments').select('id,trip_id,amount,payment_method,collected_by,collected_at').gte('collected_at',start.toISOString()).lte('collected_at',end.toISOString()),
    sb.from('expenses').select('id,driver_id,amount,category,created_at').gte('created_at',start.toISOString()).lte('created_at',end.toISOString()),
    sb.from('cash_sessions').select('id,driver_id,business_date,opening_cash,expected_closing_cash,declared_closing_cash,variance,opened_at,closed_at').gte('business_date',from).lte('business_date',to),
    sb.from('outstanding_payments').select('amount_due,amount_collected,status,due_on_return,created_at,updated_at').neq('status','paid')
  ]);
  const err=[tr,pa,ex,cs,outs].find(x=>x.error); if(err){body.innerHTML=msg(err.error.message,true);return}
  const trips=tr.data||[], payments=pa.data||[], expensesData=ex.data||[], sessions=cs.data||[], outstanding=outs.data||[];
  const tripValue=trips.reduce((a,x)=>a+Number(x.price||0),0), collected=payments.reduce((a,x)=>a+Number(x.amount||0),0), expensesTotal=expensesData.reduce((a,x)=>a+Number(x.amount||0),0);
  const completed=trips.filter(x=>x.status==='completed').length, cancelled=trips.filter(x=>x.status==='cancelled').length;
  const cashCollected=payments.filter(x=>String(x.payment_method).toLowerCase()==='cash').reduce((a,x)=>a+Number(x.amount||0),0);
  const cardCollected=payments.filter(x=>String(x.payment_method).toLowerCase()==='card').reduce((a,x)=>a+Number(x.amount||0),0);
  const otherCollected=collected-cashCollected-cardCollected;
  const openSessions=sessions.filter(x=>!x.closed_at).length, variance=sessions.filter(x=>x.closed_at).reduce((a,x)=>a+Number(x.variance||0),0);
  const outstandingTotal=outstanding.reduce((a,x)=>a+Math.max(0,Number(x.amount_due||0)-Number(x.amount_collected||0)),0);
  const net=collected-expensesTotal;
  const avg=trips.length?tripValue/trips.length:0;
  const statusRows=['scheduled','assigned','accepted','en_route','arrived','passenger_onboard','completed','cancelled'].map(st=>{const n=trips.filter(x=>x.status===st).length;return `<tr><td>${esc(st.replaceAll('_',' '))}</td><td>${n}</td><td>${trips.length?((n/trips.length)*100).toFixed(1)+'%':'0%'}</td></tr>`}).join('');
  const payRows=[['Cash',cashCollected],['Card',cardCollected],['Other',otherCollected]].map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${collected?((x[1]/collected)*100).toFixed(1)+'%':'0%'}</td></tr>`).join('');
  const expenseByCat={}; expensesData.forEach(x=>{expenseByCat[x.category]=(expenseByCat[x.category]||0)+Number(x.amount||0)});
  const expenseRows=Object.entries(expenseByCat).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0])}</td><td>${money(x[1])}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No expenses.</td></tr>';
  body.innerHTML=`<div class="cards"><div class="card"><div class="muted">Trip Value</div><div class="metric">${money(tripValue)}</div></div><div class="card"><div class="muted">Payments Collected</div><div class="metric">${money(collected)}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">${money(expensesTotal)}</div></div><div class="card"><div class="muted">Net Collected</div><div class="metric">${money(net)}</div></div><div class="card"><div class="muted">Trips</div><div class="metric">${trips.length}</div></div><div class="card"><div class="muted">Avg Trip Value</div><div class="metric">${money(avg)}</div></div></div>
  <div class="cards" style="margin-top:13px"><div class="card"><div class="muted">Completed</div><div class="metric">${completed}</div></div><div class="card"><div class="muted">Cancelled</div><div class="metric">${cancelled}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric">${money(outstandingTotal)}</div></div><div class="card"><div class="muted">Cash Variance</div><div class="metric">${money(variance)}</div></div><div class="card"><div class="muted">Open Cash Sessions</div><div class="metric">${openSessions}</div></div></div>
  <div class="grid2" style="margin-top:13px"><div class="section"><div class="section-head"><h2>Payment Methods</h2></div>${table(['Method','Collected','Share'],payRows)}</div><div class="section"><div class="section-head"><h2>Trip Status</h2></div>${table(['Status','Trips','Share'],statusRows)}</div></div>
  <div class="grid2" style="margin-top:13px"><div class="section"><div class="section-head"><h2>Expenses by Category</h2></div>${table(['Category','Amount'],expenseRows)}</div><div class="section"><div class="section-head"><h2>Cash Reconciliation</h2></div>${table(['Metric','Value'],`<tr><td>Closed sessions</td><td>${sessions.filter(x=>x.closed_at).length}</td></tr><tr><td>Open sessions</td><td>${openSessions}</td></tr><tr><td>Expected closing cash</td><td>${money(sessions.filter(x=>x.closed_at).reduce((a,x)=>a+Number(x.expected_closing_cash||0),0))}</td></tr><tr><td>Declared closing cash</td><td>${money(sessions.filter(x=>x.closed_at).reduce((a,x)=>a+Number(x.declared_closing_cash||0),0))}</td></tr><tr><td>Total variance</td><td>${money(variance)}</td></tr>`)}</div></div>`;

 window.editTransportZone=id=>{const z=zones.find(x=>x.id===id);if(!z)return;openModal('Edit zone',`<div class="field"><label>Zone name</label><input id="trEditZoneName" maxlength="100" value="${esc(z.name)}" required></div><div class="form-actions"><button class="primary" onclick="saveTransportZone('${id}')">Save changes</button></div>`)};

 window.toggleTransportZone=async(id,active)=>{const z=zones.find(x=>x.id===id);if(!z)return;if(!confirm(`${active?'Deactivate':'Activate'} zone "${z.name}"? Deactivating hides it from new selections.`))return;const r=await sb.from('transport_zones').update({active:!active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Zone status updated.');await load()}};
 window.deleteTransportZone=async id=>{const z=zones.find(x=>x.id===id);if(!z)return;if(dests.some(d=>d.zone_id===id)||fares.some(f=>f.zone_a_id===id||f.zone_b_id===id)){tell('This zone is assigned to destinations or pricing. Deactivate it instead, or reassign/remove those records first.',true);return}if(!confirm(`Delete zone "${z.name}" permanently?`))return;const r=await sb.from('transport_zones').delete().eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Zone deleted.');await load()}};
 window.editTransportDestination=id=>{const d=dests.find(x=>x.id===id);if(!d)return;openModal('Rename destination',`<div class="field"><label>Destination name</label><input id="trEditDestinationName" maxlength="120" value="${esc(d.name)}" required></div><div class="form-actions"><button class="primary" onclick="saveTransportDestination('${id}')">Save changes</button></div>`)};
 window.saveTransportDestination=async id=>{const name=$('trEditDestinationName')?.value.trim();if(!name)return tell('Enter a destination name.',true);const r=await sb.from('transport_destinations').update({name}).eq('id',id);if(r.error)tell(r.error.message,true);else{closeModal();tell('Destination renamed.');await load()}};
 window.saveTransportDestinationZone=async id=>{const zone_id=$('destzone_'+id)?.value;if(!zone_id)return tell('Choose a zone first.',true);const r=await sb.from('transport_destinations').update({zone_id}).eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Destination zone updated.');await load()}};
 window.toggleTransportDestination=async(id,active)=>{const d=dests.find(x=>x.id===id);if(!d)return;if(!confirm(`${active?'Deactivate':'Activate'} destination "${d.name}"?`))return;const r=await sb.from('transport_destinations').update({active:!active}).eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Destination status updated.');await load()}};
 window.deleteTransportDestination=async id=>{const d=dests.find(x=>x.id===id);if(!d)return;if(requests.some(r=>r.origin_destination_id===id||r.destination_destination_id===id)){tell('This destination appears in booking history. Deactivate it to preserve records.',true);return}if(!confirm(`Delete destination "${d.name}" permanently?`))return;const r=await sb.from('transport_destinations').delete().eq('id',id);if(r.error)tell('Could not delete this destination. It may be referenced by an existing booking or legacy route. Deactivate it instead. '+r.error.message,true);else{tell('Destination deleted.');await load()}};
 window.resetTransportZoneFareForm=()=>{if(!$('trZoneFareForm'))return;$('trZoneFareForm').reset();$('trZoneFareId').value='';$('trZoneFareFormTitle').textContent='Add a new zone fare';$('trZoneFareSaveButton').textContent='Save zone fare';$('trZoneFareHelp').textContent='One fare covers both directions. You can also create a within-zone fare, such as Cupecoy ↔ Cupecoy.';$('trZoneDuration').value=30;$('trZoneFixedFare').value=0;$('trZonePaxFare').value=0;$('trZoneWaiting').value=0;$('trZoneStop').value=0;$('trZoneSpecial').value=0};
 const fillFare=(f,duplicate=false)=>{resetTransportZoneFareForm();$('trFareZoneA').value=f.zone_a_id;$('trFareZoneB').value=duplicate?'':f.zone_b_id;$('trZoneDuration').value=f.estimated_duration_minutes;$('trZoneFixedFare').value=f.fixed_fare_1_2;$('trZonePaxFare').value=f.per_person_fare_3_plus;$('trZoneWaiting').value=f.waiting_fee_per_15_min;$('trZoneStop').value=f.extra_stop_fee;$('trZoneSpecial').value=f.special_service_fee;if(!duplicate){$('trZoneFareId').value=f.id;$('trZoneFareFormTitle').textContent='Edit '+zoneName(f.zone_a_id)+' ↔ '+zoneName(f.zone_b_id);$('trZoneFareSaveButton').textContent='Save changes'}else{$('trZoneFareFormTitle').textContent='Duplicate zone fare';$('trZoneFareSaveButton').textContent='Create duplicated fare';$('trZoneFareHelp').textContent='Copied the pricing. Choose the other zone to create a different symmetric zone pair.'} $('trZoneFareForm').scrollIntoView({behavior:'smooth',block:'center'})};
 window.editTransportZoneFare=id=>{const f=fares.find(x=>x.id===id);if(f)fillFare(f,false)};window.duplicateTransportZoneFare=id=>{const f=fares.find(x=>x.id===id);if(f)fillFare(f,true)};
 window.toggleTransportZoneFare=async(id,active)=>{const r=await sb.from('transport_zone_fares').update({active:!active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Zone fare status updated.');await load()}};
 window.deleteTransportZoneFare=async id=>{const f=fares.find(x=>x.id===id);if(!f)return;if(requests.some(r=>r.zone_fare_id===id)){tell('This fare is referenced by booking history. Deactivate it instead.',true);return}if(!confirm(`Delete fare ${zoneName(f.zone_a_id)} ↔ ${zoneName(f.zone_b_id)}?`))return;const r=await sb.from('transport_zone_fares').delete().eq('id',id);if(r.error)tell(r.error.message,true);else{tell('Zone fare deleted.');await load()}};
 window.decideTransport=async(id,decision)=>{let reason=null;if(decision==='reject'){reason=prompt('Optional rejection reason:');if(reason===null)return}try{const {error}=await sb.rpc('transport_decide_request',{p_request_id:id,p_decision:decision,p_driver_id:null,p_vehicle_id:null,p_rejection_reason:reason});if(error)throw error;tell(`Request ${decision}d.`);await load()}catch(e){tell(e.message||String(e),true)}};
 $('transportRefresh').onclick=()=>load().catch(e=>tell(e.message,true));
 ['trZoneSearch','trDestinationSearch','trFareSearch'].forEach(id=>$(id)?.addEventListener('input',()=>{const q=$(id).value.toLowerCase();const kind=id==='trZoneSearch'?'zone':id==='trDestinationSearch'?'destination':'fare';if(kind==='zone'){document.querySelectorAll('#trZones .transport-zone-card').forEach(card=>card.style.display=card.textContent.toLowerCase().includes(q)?'':'none')}else if(kind==='destination'){document.querySelectorAll('#trDestinations tbody tr').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none')}else{document.querySelectorAll('#trZoneFares .transport-fare-card').forEach(card=>card.style.display=card.textContent.toLowerCase().includes(q)?'':'none')}}));
 $('trSaveSettings').onclick=async()=>{try{const slots=$('trSlots').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);if(slots.some(x=>!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(x))||new Set(slots).size!==slots.length)throw new Error('Enter unique 24-hour times, one per line.');const patch={max_passengers:Number($('trMax').value),min_advance_minutes:Number($('trLead').value),pending_hold_minutes:Number($('trHold').value),airport_custom_fee_1_2:Number($('trAirportFee').value),airport_custom_per_person_3_plus:Number($('trAirportPax').value),default_waiting_fee_per_15_min:Number($('trWaiting').value),default_extra_stop_fee:Number($('trStop').value),default_special_service_fee:Number($('trSpecial').value),airport_departure_slots:slots,updated_at:new Date().toISOString()};const {error}=await sb.from('transport_settings').update(patch).eq('id',1);if(error)throw error;tell('Transport settings saved.');await load()}catch(e){tell(e.message||String(e),true)}};
 $('trZoneForm').onsubmit=async e=>{e.preventDefault();const name=$('trZoneName').value.trim();if(!name)return;const r=await sb.from('transport_zones').insert({name,active:true});if(r.error)tell(r.error.message,true);else{$('trZoneName').value='';tell('Zone added.');await load()}};
 $('trDestinationForm').onsubmit=async e=>{e.preventDefault();const name=$('trDestinationName').value.trim(),zone_id=$('trDestinationZone').value;if(!name||!zone_id)return tell('Enter a destination and assign it to a zone.',true);const r=await sb.from('transport_destinations').insert({name,zone_id,active:true});if(r.error)tell(r.error.message,true);else{$('trDestinationName').value='';tell('Destination added and assigned to its zone.');await load()}};
 $('trZoneFareForm').onsubmit=async e=>{e.preventDefault();try{let zone_a_id=$('trFareZoneA').value,zone_b_id=$('trFareZoneB').value;if(!zone_a_id||!zone_b_id)throw new Error('Choose both zones.');if(zone_a_id>zone_b_id)[zone_a_id,zone_b_id]=[zone_b_id,zone_a_id];const row={zone_a_id,zone_b_id,estimated_duration_minutes:Number($('trZoneDuration').value),fixed_fare_1_2:Number($('trZoneFixedFare').value),per_person_fare_3_plus:Number($('trZonePaxFare').value),waiting_fee_per_15_min:Number($('trZoneWaiting').value),extra_stop_fee:Number($('trZoneStop').value),special_service_fee:Number($('trZoneSpecial').value),updated_at:new Date().toISOString()};if(Object.values(row).some(v=>typeof v==='number'&&(!Number.isFinite(v)||v<0))||row.estimated_duration_minutes<1)throw new Error('Check all fares and enter a duration of at least 1 minute.');const id=$('trZoneFareId').value;const r=id?await sb.from('transport_zone_fares').update(row).eq('id',id):await sb.from('transport_zone_fares').insert({...row,active:true});if(r.error){if(r.error.code==='23505')throw new Error('A fare already exists for this zone pair. Edit that fare instead.');throw r.error}tell(id?'Zone fare updated.':'Zone fare created. The same fare applies in both directions.');resetTransportZoneFareForm();await load()}catch(e){tell(e.message||String(e),true)}};
 try{await load()}catch(e){tell('Could not load zone pricing tables. Run the ProTrack zone-pricing migration first. '+(e.message||String(e)),true)}
}
