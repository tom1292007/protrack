<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ProTrack Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 12px;
      opacity: .7;
      margin-top: 3px;
    }

    main {
      max-width: 1450px;
      margin: auto;
      padding: 18px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .blue {
      background: #2563eb;
    }

    .green {
      background: #047857;
    }

    .red {
      background: #b91c1c;
    }

    .gray {
      background: #e5e7eb;
      color: #111827;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .login {
      max-width: 430px;
      margin: 70px auto;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin: 5px 0 12px;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    label {
      font-size: 12px;
      font-weight: bold;
    }

    .error {
      color: #b91c1c;
      margin-top: 10px;
    }

    .success {
      color: #047857;
      margin-top: 10px;
    }

    .muted {
      color: #6b7280;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .stat {
      font-size: 28px;
      font-weight: 800;
      margin-top: 6px;
    }

    .dispatch-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr) 350px;
      gap: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef2ff;
      font-size: 11px;
      font-weight: bold;
    }

    .status-completed {
      background: #bbf7d0;
    }

    .status-cancelled {
      background: #fee2e2;
    }

    .status-en_route {
      background: #fef3c7;
    }

    .status-arrived {
      background: #fde68a;
    }

    .status-passenger_onboard {
      background: #d1fae5;
    }

    .small {
      font-size: 12px;
    }

    .actions button {
      margin: 3px;
      padding: 7px 9px;
      font-size: 11px;
    }

    @media(max-width: 950px) {

      .dispatch-layout {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<header>

  <div>

    <div class="logo">
      PROTRACK
    </div>

    <div class="subtitle">
      Management Control Center
    </div>

  </div>

  <div>

    <span id="managerName"></span>

    <button
      class="gray"
      onclick="signOut()"
    >
      Sign out
    </button>

  </div>

</header>


<main>

<!-- LOGIN -->

<section
  id="loginSection"
  class="card login"
>

  <h2>
    Management Sign In
  </h2>

  <label>
    Email
  </label>

  <input
    id="email"
    type="email"
    placeholder="Manager email"
  >

  <label>
    Password
  </label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="blue"
    onclick="signIn()"
  >
    Sign In
  </button>

  <div
    id="loginError"
    class="error"
  ></div>

</section>


<!-- MANAGEMENT -->

<section
  id="management"
  class="hidden"
>


<nav>

  <button
    onclick="showSection('dashboard')"
  >
    Dashboard
  </button>

  <button
    onclick="showSection('dispatch')"
  >
    Dispatch
  </button>

  <button
    onclick="showSection('drivers')"
  >
    Drivers
  </button>

  <button
    onclick="showSection('activities')"
  >
    Activities
  </button>

  <button
    onclick="showSection('guests')"
  >
    Guests
  </button>

</nav>


<!-- DASHBOARD -->

<section
  id="dashboard"
>

  <div class="grid">

    <div class="card">

      Today's Trips

      <div
        id="tripCount"
        class="stat"
      >
        0
      </div>

    </div>


    <div class="card">

      Completed

      <div
        id="completedCount"
        class="stat"
      >
        0
      </div>

    </div>


    <div class="card">

      Trip Value

      <div
        id="tripValue"
        class="stat"
      >
        $0
      </div>

    </div>


    <div class="card">

      Outstanding

      <div
        id="outstanding"
        class="stat"
      >
        $0
      </div>

    </div>


    <div class="card">

      Unassigned

      <div
        id="unassigned"
        class="stat"
      >
        0
      </div>

    </div>

  </div>


  <div class="card">

    <h2>
      Today's Operations
    </h2>

    <div
      id="dashboardTrips"
    >
      Loading...
    </div>

  </div>

</section>


<!-- DISPATCH -->

<section
  id="dispatch"
  class="hidden"
>

<div class="dispatch-layout">


<div>

<div class="card">

  <h2>
    Dispatch Board
  </h2>

  <label>
    Date
  </label>

  <input
    id="dispatchDate"
    type="date"
    onchange="loadDispatch()"
  >

  <label>
    Status
  </label>

  <select
    id="statusFilter"
    onchange="loadDispatch()"
  >

    <option value="all">
      All
    </option>

    <option value="scheduled">
      Scheduled
    </option>

    <option value="assigned">
      Assigned
    </option>

    <option value="accepted">
      Accepted
    </option>

    <option value="en_route">
      En Route
    </option>

    <option value="arrived">
      Arrived
    </option>

    <option value="passenger_onboard">
      Passenger Onboard
    </option>

    <option value="completed">
      Completed
    </option>

    <option value="cancelled">
      Cancelled
    </option>

  </select>

  <button
    class="gray"
    onclick="loadDispatch()"
  >
    Refresh
  </button>

</div>


<div class="card">

  <div
    id="dispatchTable"
    class="table-wrap"
  >
    Loading...
  </div>

</div>

</div>


<!-- CREATE TRIP -->

<div>

<div class="card">

<h2>
  Create Trip
</h2>


<label>
  Client Name
</label>

<input
  id="clientName"
>


<label>
  Date & Time
</label>

<input
  id="tripDate"
  type="datetime-local"
>


<label>
  Pickup
</label>

<input
  id="pickup"
>


<label>
  Destination
</label>

<input
  id="destination"
>


<label>
  Passengers
</label>

<input
  id="passengers"
  type="number"
  value="1"
  min="1"
>


<label>
  Price
</label>

<input
  id="price"
  type="number"
  step="0.01"
>


<label>
  Driver
</label>

<select
  id="driverSelect"
>

  <option value="">
    Unassigned
  </option>

</select>


<label>
  Payment
</label>

<select
  id="paymentStatus"
>

  <option value="unpaid">
    Unpaid
  </option>

  <option value="paid">
    Paid
  </option>

  <option value="partial">
    Partial
  </option>

  <option value="collect_on_return">
    Collect on Return
  </option>

  <option value="waived">
    Waived
  </option>

</select>


<label>
  Special Instructions
</label>

<textarea
  id="instructions"
></textarea>


<button
  class="blue"
  onclick="createTrip()"
>
  Create Trip
</button>


<div
  id="tripMessage"
  class="small"
></div>

</div>

</div>

</div>

</section>


<!-- DRIVERS -->

<section
  id="drivers"
  class="hidden"
>

<div class="card">

<h2>
  Drivers
</h2>

<div
  id="driversTable"
  class="table-wrap"
>
  Loading...
</div>

</div>

</section>


<!-- ACTIVITIES -->

<section
  id="activities"
  class="hidden"
>

<div class="card">

<h2>
  Activities
</h2>

<div
  id="activitiesTable"
  class="table-wrap"
>
  Loading...
</div>

</div>

</section>


<!-- GUESTS -->

<section
  id="guests"
  class="hidden"
>

<div class="card">

<h2>
  Guest Bookings
</h2>

<div
  id="guestBookings"
  class="table-wrap"
>
  Loading...
</div>

</div>

</section>


</section>

</main>


<script>

const db =
  supabase.createClient(
    PROTRACK_CONFIG.supabaseUrl,
    PROTRACK_CONFIG.supabaseKey
  );


let currentProfile = null;

let drivers = [];


/* -----------------------------
   LOGIN
------------------------------ */

async function signIn() {

  document.getElementById(
    "loginError"
  ).textContent = "";

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    document.getElementById(
      "loginError"
    ).textContent =
      error.message;

    return;
  }

  await initialize(
    data.user
  );
}


/* -----------------------------
   INITIALIZE
------------------------------ */

async function initialize(
  user
) {

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        user.id
      )
      .single();


  if (
    error ||
    !data
  ) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Management profile not found.";

    return;
  }


  if (
    ![
      "manager",
      "dispatcher",
      "admin"
    ].includes(
      data.role
    )
  ) {

    document.getElementById(
      "loginError"
    ).textContent =
      "This account does not have management access.";

    await db.auth.signOut();

    return;
  }


  currentProfile =
    data;


  document.getElementById(
    "managerName"
  ).textContent =
    data.full_name;


  document.getElementById(
    "loginSection"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "management"
  ).classList.remove(
    "hidden"
  );


  setDates();


  await loadDrivers();

  await loadDashboard();

  await loadDispatch();

  await loadActivities();

  await loadGuests();


  setupRealtime();

}


/* -----------------------------
   DATE
------------------------------ */

function setDates() {

  const now =
    new Date();

  const offset =
    now.getTimezoneOffset();

  const local =
    new Date(
      now.getTime() -
      offset * 60000
    );


  document.getElementById(
    "dispatchDate"
  ).value =
    local
      .toISOString()
      .slice(
        0,
        10
      );


  const future =
    new Date(
      now.getTime() +
      30 * 60000
    );


  const localFuture =
    new Date(
      future.getTime() -
      future.getTimezoneOffset() *
      60000
    );


  document.getElementById(
    "tripDate"
  ).value =
    localFuture
      .toISOString()
      .slice(
        0,
        16
      );

}


/* -----------------------------
   NAVIGATION
------------------------------ */

function showSection(
  section
) {

  [
    "dashboard",
    "dispatch",
    "drivers",
    "activities",
    "guests"
  ].forEach(
    name => {

      document
        .getElementById(
          name
        )
        .classList.toggle(
          "hidden",
          name !== section
        );

    }
  );


  if (
    section ===
    "dashboard"
  )
    loadDashboard();


  if (
    section ===
    "dispatch"
  )
    loadDispatch();


  if (
    section ===
    "drivers"
  )
    loadDrivers();


  if (
    section ===
    "activities"
  )
    loadActivities();


  if (
    section ===
    "guests"
  )
    loadGuests();

}


/* -----------------------------
   GET TODAY'S TRIPS
------------------------------ */

async function getTrips() {

  const date =
    document.getElementById(
      "dispatchDate"
    ).value;


  const start =
    new Date(
      date + "T00:00:00"
    );


  const end =
    new Date(start);

  end.setDate(
    end.getDate() + 1
  );


  const {
    data,
    error
  } =
    await db
      .from("trips")
      .select(`
        id,
        booking_reference,
        scheduled_at,
        pickup_location,
        destination_location,
        passenger_count,
        price,
        status,
        payment_status,
        payment_due_on_return,
        special_instructions,
        clients(name),
        trip_assignments(
          id,
          driver_id,
          assignment_status,
          profiles!trip_assignments_driver_id_fkey(
            full_name
          )
        )
      `)
      .gte(
        "scheduled_at",
        start.toISOString()
      )
      .lt(
        "scheduled_at",
        end.toISOString()
      )
      .order(
        "scheduled_at",
        {
          ascending: true
        }
      );


  return {
    data:
      data || [],
    error
  };

}


/* -----------------------------
   DASHBOARD
------------------------------ */

async function loadDashboard() {

  const {
    data,
    error
  } =
    await getTrips();


  if (error) {

    document.getElementById(
      "dashboardTrips"
    ).textContent =
      error.message;

    return;
  }


  const trips =
    data || [];


  document.getElementById(
    "tripCount"
  ).textContent =
    trips.length;


  document.getElementById(
    "completedCount"
  ).textContent =
    trips.filter(
      t =>
        t.status ===
        "completed"
    ).length;


  document.getElementById(
    "tripValue"
  ).textContent =
    money(
      trips.reduce(
        (sum, t) =>
          sum +
          Number(
            t.price || 0
          ),
        0
      )
    );


  document.getElementById(
    "outstanding"
  ).textContent =
    money(
      trips
        .filter(
          t =>
            [
              "unpaid",
              "partial",
              "collect_on_return"
            ].includes(
              t.payment_status
            )
        )
        .reduce(
          (sum, t) =>
            sum +
            Number(
              t.price || 0
            ),
          0
        )
    );


  document.getElementById(
    "unassigned"
  ).textContent =
    trips.filter(
      t =>
        !t.trip_assignments ||
        !t.trip_assignments.length
    ).length;


  renderTrips(
    "dashboardTrips",
    trips,
    false
  );

}


/* -----------------------------
   DISPATCH
------------------------------ */

async function loadDispatch() {

  const {
    data,
    error
  } =
    await getTrips();


  if (error) {

    document.getElementById(
      "dispatchTable"
    ).textContent =
      error.message;

    return;
  }


  const filter =
    document.getElementById(
      "statusFilter"
    ).value;


  let trips =
    data || [];


  if (
    filter !==
    "all"
  ) {

    trips =
      trips.filter(
        t =>
          t.status ===
          filter
      );

  }


  renderTrips(
    "dispatchTable",
    trips,
    true
  );

}


/* -----------------------------
   RENDER TRIPS
------------------------------ */

function renderTrips(
  target,
  trips,
  actions
) {

  if (
    !trips.length
  ) {

    document.getElementById(
      target
    ).innerHTML =
      "<p class='muted'>No trips found.</p>";

    return;
  }


  let html = `

    <table>

      <thead>

        <tr>

          <th>
            Time
          </th>

          <th>
            Reference
          </th>

          <th>
            Client
          </th>

          <th>
            Route
          </th>

          <th>
            Pax
          </th>

          <th>
            Driver
          </th>

          <th>
            Price
          </th>

          <th>
            Payment
          </th>

          <th>
            Status
          </th>

          ${
            actions
              ? "<th>Actions</th>"
              : ""
          }

        </tr>

      </thead>

      <tbody>
  `;


  trips.forEach(
    trip => {

      const assignment =
        trip.trip_assignments &&
        trip.trip_assignments[0];


      const driver =
        assignment &&
        assignment.profiles
          ? assignment
              .profiles
              .full_name
          : "Unassigned";


      let actionHTML =
        "";


      if (actions) {

        actionHTML = `

          <select
            onchange="
              assignDriver(
                '${trip.id}',
                this.value
              )
            "
          >

            <option value="">
              Assign Driver
            </option>

            ${
              drivers
                .filter(
                  d =>
                    d.active
                )
                .map(
                  d => `

                    <option
                      value="${d.id}"
                      ${
                        assignment &&
                        assignment.driver_id ===
                        d.id
                          ? "selected"
                          : ""
                      }
                    >
                      ${escapeHTML(
                        d.full_name
                      )}
                    </option>

                  `
                )
                .join("")
            }

          </select>

        `;


        if (
          trip.status !==
            "completed" &&
          trip.status !==
            "cancelled"
        ) {

          actionHTML += `

            <button
              class="blue"
              onclick="
                advanceTrip(
                  '${trip.id}',
                  '${trip.status}'
                )
              "
            >
              Advance
            </button>

            <button
              class="red"
              onclick="
                cancelTrip(
                  '${trip.id}'
                )
              "
            >
              Cancel
            </button>

          `;

        }

      }


      html += `

        <tr>

          <td>
            ${formatTime(
              trip.scheduled_at
            )}
          </td>

          <td>
            <strong>
              ${escapeHTML(
                trip.booking_reference
              )}
            </strong>

            ${
              trip.special_instructions
                ? `
                  <div class="small muted">
                    ${escapeHTML(
                      trip.special_instructions
                    )}
                  </div>
                `
                : ""
            }

          </td>

          <td>
            ${escapeHTML(
              trip.clients
                ? trip.clients.name
                : "—"
            )}
          </td>

          <td>
            ${escapeHTML(
              trip.pickup_location
            )}

            →

            ${escapeHTML(
              trip.destination_location
            )}
          </td>

          <td>
            ${trip.passenger_count}
          </td>

          <td>
            ${escapeHTML(
              driver
            )}
          </td>

          <td>
            ${money(
              trip.price
            )}
          </td>

          <td>
            ${formatStatus(
              trip.payment_status
            )}
          </td>

          <td>

            <span class="badge">

              ${formatStatus(
                trip.status
              )}

            </span>

          </td>

          ${
            actions
              ? `
                <td class="actions">
                  ${actionHTML}
                </td>
              `
              : ""
          }

        </tr>

      `;

    }
  );


  html += `
      </tbody>
    </table>
  `;


  document.getElementById(
    target
  ).innerHTML =
    html;

}


/* -----------------------------
   DRIVERS
------------------------------ */

async function loadDrivers() {

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "id,full_name,phone,active,role"
      )
      .eq(
        "role",
        "driver"
      )
      .order(
        "full_name"
      );


  if (error) {

    document.getElementById(
      "driversTable"
    ).textContent =
      error.message;

    return;
  }


  drivers =
    data || [];


  document.getElementById(
    "driverSelect"
  ).innerHTML = `

    <option value="">
      Unassigned
    </option>

    ${
      drivers
        .filter(
          d =>
            d.active
        )
        .map(
          d => `

            <option
              value="${d.id}"
            >
              ${escapeHTML(
                d.full_name
              )}
            </option>

          `
        )
        .join("")
    }

  `;


  document.getElementById(
    "driversTable"
  ).innerHTML = `

    <table>

      <thead>

        <tr>

          <th>
            Name
          </th>

          <th>
            Phone
          </th>

          <th>
            Status
          </th>

        </tr>

      </thead>

      <tbody>

        ${
          drivers
            .map(
              d => `

                <tr>

                  <td>
                    ${escapeHTML(
                      d.full_name
                    )}
                  </td>

                  <td>
                    ${escapeHTML(
                      d.phone || ""
                    )}
                  </td>

                  <td>

                    <span class="badge">
                      ${
                        d.active
                          ? "Active"
                          : "Inactive"
                      }
                    </span>

                  </td>

                </tr>

              `
            )
            .join("")
        }

      </tbody>

    </table>

  `;

}


/* -----------------------------
   ASSIGN DRIVER
------------------------------ */

async function assignDriver(
  tripId,
  driverId
) {

  if (!driverId)
    return;


  const {
    data: existing
  } =
    await db
      .from("trip_assignments")
      .select("id")
      .eq(
        "trip_id",
        tripId
      )
      .maybeSingle();


  let error;


  if (existing) {

    ({
      error
    } =
      await db
        .from("trip_assignments")
        .update({
          driver_id:
            driverId,

          assignment_status:
            "assigned",

          assigned_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          existing.id
        ));

  } else {

    ({
      error
    } =
      await db
        .from("trip_assignments")
        .insert({
          trip_id:
            tripId,

          driver_id:
            driverId,

          assignment_status:
            "assigned"
        }));

  }


  if (error) {

    alert(
      error.message
    );

    return;
  }


  await db
    .from("trips")
    .update({
      status:
        "assigned",

      updated_at:
        new Date()
          .toISOString()
    })
    .eq(
      "id",
      tripId
    );


  await loadDispatch();

  await loadDashboard();

}


/* -----------------------------
   ADVANCE STATUS
------------------------------ */

const nextStatus = {

  scheduled:
    "assigned",

  assigned:
    "accepted",

  accepted:
    "en_route",

  en_route:
    "arrived",

  arrived:
    "passenger_onboard",

  passenger_onboard:
    "completed"

};


async function advanceTrip(
  tripId,
  status
) {

  const next =
    nextStatus[
      status
    ];


  if (!next)
    return;


  const {
    error
  } =
    await db
      .from("trips")
      .update({
        status:
          next,

        updated_at:
          new Date()
            .toISOString()
      })
      .eq(
        "id",
        tripId
      );


  if (error) {

    alert(
      error.message
    );

    return;
  }


  await db
    .from(
      "trip_status_history"
    )
    .insert({
      trip_id:
        tripId,

      status:
        next,

      changed_by:
        currentProfile.id
    });


  await loadDispatch();

  await loadDashboard();

}

/* -----------------------------
   CREATE TRIP
------------------------------ */

async function createTrip() {

  const message =
    document.getElementById(
      "tripMessage"
    );


  message.textContent =
    "";


  const clientName =
    document.getElementById(
      "clientName"
    ).value.trim();


  const date =
    document.getElementById(
      "tripDate"
    ).value;


  const pickup =
    document.getElementById(
      "pickup"
    ).value.trim();


  const destination =
    document.getElementById(
      "destination"
    ).value.trim();


  const passengers =
    Number(
      document.getElementById(
        "passengers"
      ).value
    );


  const price =
    Number(
      document.getElementById(
        "price"
      ).value || 0
    );


  const driver =
    document.getElementById(
      "driverSelect"
    ).value;


  const payment =
    document.getElementById(
      "paymentStatus"
    ).value;


  const instructions =
    document.getElementById(
      "instructions"
    ).value.trim();


  if (
    !clientName ||
    !date ||
    !pickup ||
    !destination
  ) {

    message.textContent =
      "Please complete the required fields.";

    message.className =
      "error";

    return;
  }


  const {
    data: client,
    error: clientError
  } =
    await db
      .from("clients")
      .insert({
        name:
          clientName
      })
      .select()
      .single();


  if (clientError) {

    message.textContent =
      clientError.message;

    message.className =
      "error";

    return;
  }


  const {
    data: trip,
    error: tripError
  } =
    await db
      .from("trips")
      .insert({

        client_id:
          client.id,

        scheduled_at:
          new Date(
            date
          ).toISOString(),

        pickup_location:
          pickup,

        destination_location:
          destination,

        passenger_count:
          passengers,

        price:
          price,

        payment_status:
          payment,

        payment_due_on_return:
          payment ===
          "collect_on_return",

        special_instructions:
          instructions,

        created_by:
          currentProfile.id,

        status:
          driver
            ? "assigned"
            : "scheduled"

      })
      .select()
      .single();


  if (tripError) {

    message.textContent =
      tripError.message;

    message.className =
      "error";

    return;
  }


  if (driver) {

    const {
      error
    } =
      await db
        .from(
          "trip_assignments"
        )
        .insert({

          trip_id:
            trip.id,

          driver_id:
            driver,

          assignment_status:
            "assigned"

        });


    if (error) {

      message.textContent =
        error.message;

      message.className =
        "error";

      return;
    }

  }


  message.textContent =
    "Trip created successfully.";

  message.className =
    "success";


  document.getElementById(
    "clientName"
  ).value = "";

  document.getElementById(
    "pickup"
  ).value = "";

  document.getElementById(
    "destination"
  ).value = "";

  document.getElementById(
    "price"
  ).value = "";

  document.getElementById(
    "instructions"
  ).value = "";


  await loadDashboard();

  await loadDispatch();

}


/* -----------------------------
   ACTIVITIES
------------------------------ */

async function loadActivities() {

  const {
    data,
    error
  } =
    await db
      .from("activities")
      .select(`
        id,
        name,
        location,
        price,
        price_type,
        active,
        activity_categories(name)
      `)
      .order(
        "name"
      );


  if (error) {

    document.getElementById(
      "activitiesTable"
    ).textContent =
      error.message;

    return;
  }


  if (!data || !data.length) {

    document.getElementById(
      "activitiesTable"
    ).innerHTML =
      "<p class='muted'>No activities created yet.</p>";

    return;
  }


  document.getElementById(
    "activitiesTable"
  ).innerHTML = `

    <table>

      <thead>

        <tr>

          <th>
            Activity
          </th>

          <th>
            Category
          </th>

          <th>
            Location
          </th>

          <th>
            Price
          </th>

          <th>
            Status
          </th>

        </tr>

      </thead>

      <tbody>

        ${
          data
            .map(
              activity => `

                <tr>

                  <td>
                    ${escapeHTML(
                      activity.name
                    )}
                  </td>

                  <td>
                    ${
                      activity
                        .activity_categories
                        ? escapeHTML(
                            activity
                              .activity_categories
                              .name
                          )
                        : ""
                    }
                  </td>

                  <td>
                    ${escapeHTML(
                      activity.location || ""
                    )}
                  </td>

                  <td>
                    ${money(
                      activity.price
                    )}
                  </td>

                  <td>
                    ${
                      activity.active
                        ? "Active"
                        : "Inactive"
                    }
                  </td>

                </tr>

              `
            )
            .join("")
        }

      </tbody>

    </table>

  `;

}


/* -----------------------------
   GUEST BOOKINGS
------------------------------ */

async function loadGuests() {

  const {
    data,
    error
  } =
    await db
      .from(
        "guest_bookings"
      )
      .select(`
        id,
        booking_reference,
        status,
        total_amount,
        payment_status,
        booking_date,
        properties(name)
      `)
      .order(
        "booking_date",
        {
          ascending:
            false
        }
      )
      .limit(
        50
      );


  if (error) {

    document.getElementById(
      "guestBookings"

      error.message;

    return;
  }


  if (!data || !data.length) {

    document.getElementById(
      "guestBookings"
    ).innerHTML =
      "<p class='muted'>No guest bookings yet.</p>";

    return;
  }


  document.getElementById(
    "guestBookings"
  ).innerHTML = `

    <table>

      <thead>

        <tr>

          <th>
            Reference
          </th>

          <th>
            Property
          </th>

          <th>
            Date
          </th>

          <th>
            Total
          </th>

          <th>
            Status
          </th>

          <th>
            Payment
          </th>

        </tr>

      </thead>

      <tbody>

        ${
          data
            .map(
              booking => `

                <tr>

                  <td>
                    ${escapeHTML(
                      booking
                        .booking_reference
                    )}
                  </td>

                  <td>
                    ${
                      booking
                        .properties
                        ? escapeHTML(
                            booking
                              .properties
                              .name
                          )

                    }
                  </td>

                  <td>
                    ${new Date(
                      booking

                  </td>

                  <td>
                    ${money(
                      booking

                    )}
                  </td>

                  <td>
                    ${formatStatus(

                  </td>

                  <td>
                    ${formatStatus(
                      booking.payment_status

                  </td>

                </tr>

              `
            )
            .join("")
        }

      </tbody>

    </table>

  `;

}


/* -----------------------------
   REALTIME
------------------------------ */

function setupRealtime() {

  db
    .channel(
      "protrack-management"
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "trips"
      },
      () => {

        loadDashboard();

        loadDispatch();

      }
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table:
          "guest_bookings"
      },
      () => {

        loadGuests();

      }
    )
    .subscribe();

}

/* -----------------------------
   HELPERS
------------------------------ */

function money(
  value
) {

  return (
    "$" +
    Number(
      value || 0
    ).toFixed(2)
  );

}


function formatTime(
  value
) {

  return new Date(
    value
  ).toLocaleTimeString(
    [],
    {
      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );

}


function formatStatus(
  value
) {

  return String(
    value || ""
  )
    .replaceAll(
      "_",
      " "
    )
    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );

}


function escapeHTML(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
