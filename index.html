<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProTrack Driver</title>
<style>
:root{--navy:#111827;--blue:#2563eb;--bg:#f3f4f6;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--green:#047857;--red:#b91c1c;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a}
header{background:var(--navy);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{font-weight:900;letter-spacing:.5px}.sub{font-size:12px;opacity:.7}
main{max-width:850px;margin:auto;padding:14px}
.card{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
button{border:0;border-radius:10px;padding:12px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
button.blue{background:var(--blue)}button.green{background:var(--green)}button.red{background:var(--red)}button.secondary{background:#e5e7eb;color:#111827}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px}
.hidden{display:none!important}.error{color:var(--red)}.success{color:var(--green)}.muted{color:var(--muted)}
.trip{border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}
.route{font-size:19px;font-weight:800}.time{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kv{background:#f9fafb;padding:10px;border-radius:10px}.kv small{display:block;color:var(--muted);font-size:11px}.kv b{display:block;margin-top:3px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:800}
.status-en_route{background:#fef3c7}.status-arrived{background:#fde68a}.status-passenger_onboard{background:#d1fae5}.status-completed{background:#bbf7d0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions button:last-child:nth-child(odd){grid-column:1/-1}
@media(max-width:500px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <div><div class="brand">PROTRACK</div><div class="sub">Driver App</div></div>
 <div><span id="driverName"></span> <button class="secondary" onclick="signOut()">Sign out</button></div>
</header>
<main>
<section id="loginCard" class="card">
 <h2>Driver Sign in</h2>
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <button class="blue" onclick="signIn()">Sign in</button>
 <p id="loginMessage" class="error"></p>
</section>

<section id="app" class="hidden">
 <div class="card">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
     <div><h2 style="margin:0">Today's Trips</h2><div class="muted" id="todayLabel"></div></div>
     <button class="secondary" onclick="loadTrips()">Refresh</button>
   </div>
 </div>
 <div id="trips">Loading...</div>
 <div class="card">
   <h3>Driver status</h3>
   <div class="muted small">GPS and cash controls will be added after the trip workflow is confirmed.</div>
 </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(PROTRACK_CONFIG.supabaseUrl,PROTRACK_CONFIG.supabaseKey);
let driver=null, channel=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>'$'+Number(v||0).toFixed(2);
const label=s=>String(s||'').replaceAll('_',' ');
function todayRange(){
 const d=new Date();const start=new Date(d.getFullYear(),d.getMonth(),d.getDate());const end=new Date(start);end.setDate(end.getDate()+1);
 return [start.toISOString(),end.toISOString()];
}
async function signIn(){
 $('loginMessage').textContent='';
 const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error){$('loginMessage').textContent=error.message;return}
 await init();
}
async function signOut(){await db.auth.signOut();location.reload()}

async function init(){
 const {data:{user}}=await db.auth.getUser();if(!user)return;
 const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();
 if(error||!data){$('loginMessage').textContent=error?.message||'Driver profile not found.';return}
 if(data.role!=='driver'){$('loginMessage').textContent='This account is not a driver account.';await db.auth.signOut();return}
 driver=data;$('driverName').textContent=data.full_name;$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');
 $('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 await loadTrips();
 channel=db.channel('driver-trips')
  .on('postgres_changes',{event:'*',schema:'public',table:'trip_assignments',filter:'driver_id=eq.'+driver.id},loadTrips)
  .on('postgres_changes',{event:'*',schema:'public',table:'trips'},loadTrips)
  .subscribe();
}

async function loadTrips(){
 if(!driver)return;
 const [start,end]=todayRange();
 const {data,error}=await db.from('trips')
  .select('id,booking_reference,scheduled_at,pickup_location,destination_location,passenger_count,price,status,payment_status,payment_due_on_return,special_instructions,trip_assignments!inner(id,driver_id,assignment_status)')
  .eq('trip_assignments.driver_id',driver.id)
  .gte('scheduled_at',start).lt('scheduled_at',end)
  .order('scheduled_at',{ascending:true});
 if(error){$('trips').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return}
 renderTrips(data||[]);
}

function renderTrips(trips){
 if(!trips.length){$('trips').innerHTML='<div class="card"><h3>No trips assigned today</h3><p class="muted">New trips assigned by dispatch will appear here automatically.</p></div>';return}
 $('trips').innerHTML=trips.map(t=>{
  const a=t.trip_assignments?.[0];
  const canAccept=t.status==='assigned';
  const next={accepted:'en_route',en_route:'arrived',arrived:'passenger_onboard',passenger_onboard:'completed'}[t.status];
  return `<div class="trip">
   <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
    <div><div class="time">${new Date(t.scheduled_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div class="muted">${esc(t.booking_reference)}</div></div>
    <span class="badge status-${esc(t.status)}">${esc(label(t.status))}</span>
   </div>
   <div class="route" style="margin:12px 0">${esc(t.pickup_location)} → ${esc(t.destination_location)}</div>
   <div class="grid">
    <div class="kv"><small>Passengers</small><b>${t.passenger_count}</b></div>
    <div class="kv"><small>Price</small><b>${money(t.price)}</b></div>
    <div class="kv"><small>Payment</small><b>${esc(label(t.payment_status))}</b></div>
    <div class="kv"><small>Assignment</small><b>${esc(label(a?.assignment_status||''))}</b></div>
   </div>
   ${t.special_instructions?`<div class="card" style="margin:10px 0 0;padding:10px;background:#f9fafb"><small><b>Instructions</b></small><div>${esc(t.special_instructions)}</div></div>`:''}
   <div class="actions">
    ${canAccept?`<button class="blue" onclick="acceptTrip('${t.id}')">Accept Trip</button>`:''}
    ${next?`<button class="${next==='completed'?'green':'blue'}" onclick="advanceTrip('${t.id}','${t.status}')">${next==='completed'?'Complete Trip':esc(label(next))}</button>`:''}
   </div>
  </div>`;
 }).join('');
}

async function acceptTrip(id){
 const {error}=await db.from('trip_assignments').update({assignment_status:'accepted',accepted_at:new Date().toISOString()}).eq('trip_id',id).eq('driver_id',driver.id);
 if(error){alert(error.message);return}
 await updateTrip(id,'accepted');
}
const nextStatus={accepted:'en_route',en_route:'arrived',arrived:'passenger_onboard',passenger_onboard:'completed'};
async function advanceTrip(id,status){const n=nextStatus[status];if(n)await updateTrip(id,n)}
async function updateTrip(id,status){
 const {error}=await db.from('trips').update({status,updated_at:new Date().toISOString()}).eq('id',id);
 if(error){alert(error.message);return}
 await db.from('trip_status_history').insert({trip_id:id,status,changed_by:driver.id});
 if(status==='completed')await db.from('trip_assignments').update({assignment_status:'completed',completed_at:new Date().toISOString()}).eq('trip_id',id).eq('driver_id',driver.id);
 await loadTrips();
}
init();
</script>
</body>
</html>
